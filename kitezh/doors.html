      });
      const tree = B.Mesh.MergeMeshes(tiers, true);
      tree.material = mat('pine', { diffuseColor: new B.Color3(0.04, 0.08, 0.06) });
      const n = 800, buf = new Float32Array(n * 16);
      for (let i = 0; i < n; i++) {
        const a = rnd() * Math.PI * 2;
        const r = LAKE.r + 18 + Math.pow(rnd(), 0.7) * 110;
        const h = 10 + rnd() * 16;
        B.Matrix.Compose(V3(h * 0.28, h, h * 0.28), B.Quaternion.Identity(), V3(LAKE.x + Math.cos(a) * r, 0.2, LAKE.z + Math.sin(a) * r)).copyToArray(buf, i * 16);
      }
      tree.thinInstanceSetBuffer('matrix', buf, 16);
      statics.push(tree);
    })();

    /* ---------- небо ---------- */

    B.Effect.ShadersStore.kitezhSkyVertexShader = `
      precision highp float;
      attribute vec3 position;
      uniform mat4 worldViewProjection;
      varying vec3 vDir;
      void main() { vDir = position; gl_Position = worldViewProjection * vec4(position, 1.0); }
    `;
    B.Effect.ShadersStore.kitezhSkyFragmentShader = `
      precision highp float;
      uniform float time;
      uniform vec3 moonDir, horizon, zenith;
      varying vec3 vDir;
      float hash3(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453); }
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
      float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { s += a * noise(p); p *= 2.07; a *= 0.5; } return s; }
      void main() {
        vec3 d = normalize(vDir);
        float h = d.y;
        vec3 col = mix(horizon, zenith, smoothstep(-0.02, 0.55, h));
        vec3 sd = d * 260.0;
        float r = hash3(floor(sd));
        float star = step(0.986, r) * smoothstep(0.38, 0.0, length(fract(sd) - 0.5)) * smoothstep(0.04, 0.3, h);
        col += vec3(0.8, 0.86, 1.0) * star * (0.5 + 0.5 * sin(time * 1.7 + r * 90.0)) * 1.4;
        float md = dot(d, moonDir);
        col += vec3(0.75, 0.82, 0.95) * (pow(max(md, 0.0), 260.0) * 0.5 + pow(max(md, 0.0), 18.0) * 0.12);
        vec2 cp = d.xz / max(h, 0.06) * 1.3 + vec2(time * 0.006, time * 0.002);
        float cl = smoothstep(0.42, 0.82, fbm(cp)) * smoothstep(0.02, 0.22, h);
        vec3 cloud = mix(vec3(0.045, 0.058, 0.075), vec3(0.22, 0.26, 0.32), pow(max(md, 0.0), 8.0));
        col = mix(col, cloud, cl * 0.88);
        col += vec3(0.95, 0.97, 1.0) * smoothstep(0.99955, 0.99975, md) * 2.2 * (1.0 - cl * 0.7);
        col = mix(horizon, col, smoothstep(-0.04, 0.05, h));
        gl_FragColor = vec4(col, 1.0);
      }
    `;
    const skyMat = new B.ShaderMaterial('sky', scene, { vertex: 'kitezhSky', fragment: 'kitezhSky' },
      { attributes: ['position'], uniforms: ['worldViewProjection', 'time', 'moonDir', 'horizon', 'zenith'] });
    skyMat.backFaceCulling = false;
    skyMat.disableDepthWrite = true;
    skyMat.setVector3('moonDir', MOON_DIR);
    skyMat.setColor3('horizon', FOG);
    skyMat.setColor3('zenith', new B.Color3(0.012, 0.027, 0.06));
    const sky = B.MeshBuilder.CreateSphere('sky', { diameter: 1600, segments: 24, sideOrientation: B.Mesh.BACKSIDE }, scene);
    sky.material = skyMat;
    sky.infiniteDistance = true;
    sky.renderingGroupId = 0;
    sky.applyFog = false;

    /* ---------- вода ---------- */

    const water = new B.WaterMaterial('water', scene, lite ? new B.Vector2(512, 512) : new B.Vector2(1024, 1024));
    water.bumpTexture = normalMap('waves', waveC, 3);
    water.bumpTexture.uScale = water.bumpTexture.vScale = 6;
    water.windForce = -1.6;
    water.windDirection = new B.Vector2(1, 0.6);
    water.waveHeight = 0.0;
    water.waveLength = 0.12;
    water.bumpHeight = 0.12;
    water.waterColor = new B.Color3(0.015, 0.035, 0.05);
    water.colorBlendFactor = 0.18;
    water.waterColor2 = new B.Color3(0.02, 0.04, 0.05);
    water.colorBlendFactor2 = 0.2;
    water.specularColor = new B.Color3(0.6, 0.65, 0.75);
    water.specularPower = 220;
    water.maxSimultaneousLights = MAXL;
    // Озеро — круг воды чуть выше берегового диска: снаружи земля под лесом.
    const lake = B.MeshBuilder.CreateDisc('lake', { radius: LAKE.r + 16, tessellation: 96 }, scene);
    lake.rotation.x = Math.PI / 2;
    lake.position.set(LAKE.x, 0.26, LAKE.z);
    lake.material = water;
    // Отражаются небо, постройки, лес, лодки и люди.
    water.addToRenderList(sky);
    for (const m of statics) water.addToRenderList(m);

    // Круги на воде.
    const ringT = tex('ring', ringC, false);
    ringT.hasAlpha = true;
    const ringMat = mat('ringM', { emissiveTexture: ringT, opacityTexture: ringT, disableLighting: true, emissiveColor: new B.Color3(0.45, 0.52, 0.58), alphaMode: B.Engine.ALPHA_ADD });
    const RIPS = 60;
    const ripplePool = Array.from({ length: RIPS }, () => {
      const m = B.MeshBuilder.CreateGround('rip', { width: 1, height: 1 }, scene);
      m.material = ringMat;
      m.isVisible = false;
      m.isPickable = false;
      return { m, born: -99, life: 1, size: 1, vx: 0, vz: 0, strength: 0 };
    });
    let ripI = 0;
    function ripple(x, z, size = 2.5, life = 2.2, vx = 0, vz = 0, strength = 0.6) {
      const r = ripplePool[ripI];
      ripI = (ripI + 1) % RIPS;
      Object.assign(r, { born: clock.value, life, size, vx, vz, strength });
      r.m.position.set(x, 0.3, z);
      r.m.isVisible = true;
    }
    function updateRipples(dt) {
      const now = clock.value;
      for (const r of ripplePool) {
        if (!r.m.isVisible) continue;
        const t = (now - r.born) / r.life;
        if (t >= 1) { r.m.isVisible = false; continue; }
        r.m.position.x += r.vx * dt;
        r.m.position.z += r.vz * dt;
        const s = 0.3 + r.size * Math.sqrt(t);
        r.m.scaling.set(s, 1, s);
        r.m.visibility = r.strength * (1 - t) * Math.min(1, t * 8) * 0.6;
      }
    }

    /* ---------- лодки: игрок и горожане ---------- */

    const player = makeBoat(true, true);
    const boat = { x: 0, z: 36, yaw: Math.PI, speed: 0, turn: 0, phase: 0, rowing: 0 };

    const routes = [
      [[3, 30], [3, -40], [3, -125], [-3, -125], [-3, -40], [-3, 30]],
      [[-36, 18], [-36, -18], [-36, -54], [-36, -90], [-36, -126], [-72, -126], [-72, 18]],
      [[36, -126], [36, -54], [36, 18], [72, 18], [72, -126]],
      [[-72, -18], [72, -18], [72, -54], [-72, -54]]
    ];
    const townBoats = routes.map(r => ({ ...makeBoat(true, false), route: r, seg: 0, u: rnd(), speed: 1.2 + rnd() * 0.5 }));
    const moored = [];
    for (let i = 0; i < 8; i++) {
      const cx = pick(xs), cz = pick(zs), s = cx > 0 ? -1 : 1;
      const b = makeBoat(false, false);
      b.root.position.set(cx + s * (BLOCK / 2 + 1.1), 0.25, cz + (rnd() - 0.5) * 14);
      b.root.rotation.y = (rnd() - 0.5) * 0.3;
      moored.push(b);
    }
    for (const m of moving) water.addToRenderList(m);
    for (const p of people) water.addToRenderList(p.m);

    function updateTownBoats(dt) {
      for (const b of townBoats) {
        const a = b.route[b.seg], c = b.route[(b.seg + 1) % b.route.length];
        const len = Math.hypot(c[0] - a[0], c[1] - a[1]);
        b.u += b.speed * dt / len;
        if (b.u >= 1) { b.u = 0; b.seg = (b.seg + 1) % b.route.length; }
        const x = a[0] + (c[0] - a[0]) * b.u, z = a[1] + (c[1] - a[1]) * b.u;
        const yaw = Math.atan2(c[0] - a[0], c[1] - a[1]);
        let dy = Math.atan2(Math.sin(yaw - b.root.rotation.y), Math.cos(yaw - b.root.rotation.y));
        b.root.rotation.y += dy * (1 - Math.exp(-dt * 2));
        b.root.position.set(x, 0.25 + Math.sin(clock.value * 1.3 + b.phase) * 0.04, z);
        const before = b.phase;
        b.phase += dt * 2.6;
        poseOars(b, b.phase, 1);
        if (Math.floor(before / 6.283) !== Math.floor(b.phase / 6.283)) ripple(x, z, 3, 2.4, 0, 0, 0.45);
      }
    }

    /* ---------- управление ---------- */

    const keys = new Set();
    const stick = { x: 0, y: 0 };
    let active = false;
    addEventListener('keydown', e => { if (!active) return; keys.add(e.code); if (e.code.startsWith('Arrow')) e.preventDefault(); });
    addEventListener('keyup', e => keys.delete(e.code));
    addEventListener('blur', () => keys.clear());
    function readInput() {
      let fwd = stick.y, turn = stick.x;
      if (keys.has('KeyW') || keys.has('ArrowUp')) fwd += 1;
      if (keys.has('KeyS') || keys.has('ArrowDown')) fwd -= 1;
      if (keys.has('KeyA') || keys.has('ArrowLeft')) turn -= 1;
      if (keys.has('KeyD') || keys.has('ArrowRight')) turn += 1;
      return { fwd: Math.max(-1, Math.min(1, fwd)), turn: Math.max(-1, Math.min(1, turn)) };
    }

    // Камера: облёт мышью или пальцем; когда её не трогают, она сама заходит за корму.
    const cam = new B.ArcRotateCamera('cam', 0, 1.33, 9, V3(0, 1.4, 36), scene);
    cam.attachControl(canvas, true);
    cam.inputs.removeByType('ArcRotateCameraKeyboardMoveInput');
    cam.lowerRadiusLimit = 5;
    cam.upperRadiusLimit = 18;
    cam.lowerBetaLimit = 0.55;
    cam.upperBetaLimit = 1.45;
    cam.wheelPrecision = 40;
    cam.panningSensibility = 0;
    cam.minZ = 0.1;
    cam.maxZ = 2000;
    cam.fov = 0.9;
    let lastTouch = -10;
    canvas.addEventListener('pointerdown', () => { lastTouch = clock.value; });
    canvas.addEventListener('pointermove', e => { if (e.buttons) lastTouch = clock.value; });

    /* ---------- физика лодки ---------- */

    let onSplash = () => {};
    function collide() {
      const R = 1.5;
      for (const c of colliders) {
        if (boat.x > c.x0 - R && boat.x < c.x1 + R && boat.z > c.z0 - R && boat.z < c.z1 + R) {
          const dl = boat.x - (c.x0 - R), dr = (c.x1 + R) - boat.x, dn = boat.z - (c.z0 - R), df = (c.z1 + R) - boat.z;
          const m = Math.min(dl, dr, dn, df);
          if (m === dl) boat.x = c.x0 - R; else if (m === dr) boat.x = c.x1 + R; else if (m === dn) boat.z = c.z0 - R; else boat.z = c.z1 + R;
          boat.speed *= 0.6;
        }
      }
      const dx = boat.x - LAKE.x, dz = boat.z - LAKE.z, d = Math.hypot(dx, dz);
      if (d > LAKE.r) { boat.x = LAKE.x + dx / d * LAKE.r; boat.z = LAKE.z + dz / d * LAKE.r; boat.speed *= 0.6; }
    }
    let wakeTimer = 0;
    const boatPos = new THREE.Vector3();
    function updateBoat(dt) {
      const { fwd, turn } = readInput();
      const rowing = Math.abs(fwd) > 0.05 || Math.abs(turn) > 0.05;
      boat.rowing += ((rowing ? 1 : 0) - boat.rowing) * (1 - Math.exp(-dt * 4));
      const prev = boat.phase;
      if (rowing) boat.phase += dt * (2.2 + Math.abs(fwd) * 0.8);
      const stroke = Math.max(0, Math.sin(boat.phase));
      boat.speed += fwd * (1.4 + 3.2 * stroke) * dt;
      boat.speed *= Math.exp(-0.45 * dt);
      boat.speed = Math.max(-2, Math.min(5.5, boat.speed));
      boat.turn += (turn * (0.8 + 0.12 * Math.abs(boat.speed)) - boat.turn) * (1 - Math.exp(-dt * 3));
      boat.yaw += boat.turn * dt;
      const fx = Math.sin(boat.yaw), fz = Math.cos(boat.yaw);
      boat.x += fx * boat.speed * dt;
      boat.z += fz * boat.speed * dt;
      collide();
      if (rowing && Math.floor(prev / 6.283) !== Math.floor(boat.phase / 6.283)) {
        for (const side of [-1, 1]) ripple(boat.x + fz * side * 2.4, boat.z - fx * side * 2.4, 2.6, 2.2, 0, 0, 0.6);
        onSplash(Math.min(1, 0.4 + Math.abs(boat.speed) / 5));
      }
      wakeTimer -= dt;
      if (Math.abs(boat.speed) > 0.6 && wakeTimer <= 0) {
        wakeTimer = 0.3;
        const k = Math.min(1, boat.speed / 3);
        for (const side of [-1, 1]) ripple(boat.x + fx * 1.6 + fz * side * 0.5, boat.z + fz * 1.6 - fx * side * 0.5, 1.2 + rnd() * 0.6, 2.4, fz * side * 1.1 * k, -fx * side * 1.1 * k, 0.4 * k);
      }
      const t = clock.value;
      player.root.position.set(boat.x, 0.23 + Math.sin(t * 1.4) * 0.05, boat.z);
      player.root.rotation.set(Math.sin(t * 1.1) * 0.025 + boat.speed * 0.01, boat.yaw, Math.sin(t * 0.9) * 0.03 - boat.turn * 0.05);
      poseOars(player, boat.phase, 0.25 + 0.75 * boat.rowing);
      boatPos.set(boat.x, 0, boat.z);
    }

    function updateCamera(dt, snap) {
      const target = V3(boat.x + Math.sin(boat.yaw) * 2.5, 1.4, boat.z + Math.cos(boat.yaw) * 2.5);
      if (snap) cam.target.copyFrom(target); else cam.target = B.Vector3.Lerp(cam.target, target, 1 - Math.exp(-dt * 6));
      if (snap || clock.value - lastTouch > 1.5) {
        const behind = Math.atan2(-Math.cos(boat.yaw), -Math.sin(boat.yaw));
        let d = Math.atan2(Math.sin(behind - cam.alpha), Math.cos(behind - cam.alpha));
        cam.alpha += snap ? d : d * (1 - Math.exp(-dt * 1.5));
      }
    }

    /* ---------- живые огни ---------- */

    let poolTimer = 0;
    function updateLights(dt) {
      const t = clock.value;
      poolTimer -= dt;
      if (poolTimer <= 0) {
        poolTimer = 0.3;
        const me = V3(boat.x, 1, boat.z);
        const near = sources
          .map(s => ({ s, d: B.Vector3.DistanceSquared(s.pos, me) / (s.kind === 'fire' ? 3 : s.kind === 'window' ? 0.4 : 1) }))
          .sort((a, b) => a.d - b.d).slice(0, POOL);
        pool.forEach((l, i) => { l.src = near[i] ? near[i].s : null; if (l.src) l.position.copyFrom(l.src.pos); });
      }
      for (const l of pool) {
        const s = l.src;
        if (!s) { l.intensity = 0; continue; }
        const flick = s.kind === 'fire'
          ? 0.75 + 0.25 * Math.sin(t * 9 + s.phase) * Math.sin(t * 13.7 + s.phase * 2)
          : 0.95 + 0.05 * Math.sin(t * 7 + s.phase);
        l.intensity = (s.kind === 'fire' ? 3.2 : s.kind === 'window' ? 0.8 : 1.6) * flick;
        l.range = s.kind === 'fire' ? 20 : 13;
      }
      for (const p of people) p.m.scaling.y = 1 + Math.sin(t * 0.9 + p.phase) * 0.008;
      for (const b of moored) b.root.position.y = 0.23 + Math.sin(t * 1.2 + b.phase) * 0.04;
    }

    /* ---------- обработка кадра: свечение, тональная кривая, виньетка, зерно ---------- */

    const glow = new B.GlowLayer('glow', scene, { mainTextureSamples: lite ? 1 : 2, blurKernelSize: lite ? 32 : 48 });
    glow.intensity = 0.5;
    for (const r of ripplePool) glow.addExcludedMesh(r.m);
    for (const p of people) glow.addExcludedMesh(p.m);
    const pipe = new B.DefaultRenderingPipeline('pipe', true, scene, [cam]);
    pipe.samples = lite ? 1 : 4;
    pipe.fxaaEnabled = true;
    pipe.bloomEnabled = true;
    pipe.bloomThreshold = 0.7;
    pipe.bloomWeight = 0.3;
    pipe.bloomKernel = 64;
    pipe.bloomScale = 0.5;
    pipe.imageProcessingEnabled = true;
    pipe.imageProcessing.toneMappingEnabled = true;
    pipe.imageProcessing.toneMappingType = B.ImageProcessingConfiguration.TONEMAPPING_ACES;
    pipe.imageProcessing.exposure = 1.6;
    pipe.imageProcessing.contrast = 1.15;
    pipe.imageProcessing.vignetteEnabled = true;
    pipe.imageProcessing.vignetteWeight = 2.2;
    pipe.imageProcessing.vignetteColor = new B.Color4(0, 0, 0, 0);
    pipe.grainEnabled = true;
    pipe.grain.intensity = 7;
    pipe.grain.animated = true;

    let snapNext = true;
    scene.onBeforeRenderObservable.add(() => {
      const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
      skyMat.setFloat('time', clock.value);
      updateBoat(dt);
      updateTownBoats(dt);
      updateRipples(dt);
      updateLights(dt);
      updateCamera(dt, snapNext);
      snapNext = false;
    });

    let running = false;
    return {
      canvas, bells: bells.map(v => new THREE.Vector3(v.x, v.y, v.z)), fires,
      boatPos: () => boatPos,
      set onSplash(f) { onSplash = f; },
      setStick(x, y) { stick.x = x; stick.y = y; },
      resize() { engine.resize(); },
      enter() {
        active = true;
        Object.assign(boat, { x: 0, z: 36, yaw: Math.PI, speed: 1.2, turn: 0 });
        cam.radius = 9;
        cam.beta = 1.33;
        snapNext = true;
        canvas.style.display = 'block';
        engine.resize();
        if (!running) {
          running = true;
          let failed = false;
          engine.runRenderLoop(() => {
            try { scene.render(); }
            catch (err) { if (!failed) { failed = true; showError('город не отрисовался: ' + err.message); } }
          });
        }
      },
      leave() {
        active = false;
        keys.clear();
        stick.x = stick.y = 0;
        running = false;
        engine.stopRenderLoop();
        canvas.style.display = 'none';
      }
    };
  }

  let world = null;

  /* ============================== ЗВУК ============================== */

  let ac = null, out = null, muffle = null, soundOn = false, bellTimer = 0, crackleTimer = 0;

  function initAudio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    out = ac.createGain();
    out.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    out.connect(comp);
    comp.connect(ac.destination);

    muffle = ac.createBiquadFilter();
    muffle.type = 'lowpass';
    muffle.frequency.value = 520;
    muffle.connect(out);

    const len = ac.sampleRate * 4;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 380;
    const wg = ac.createGain();
    wg.gain.value = 0.22;
    const lfo = ac.createOscillator();
    const lfoGain = ac.createGain();
    lfo.frequency.value = 0.13;
    lfoGain.gain.value = 0.08;
    lfo.connect(lfoGain);
    lfoGain.connect(wg.gain);
    src.connect(lp);
    lp.connect(wg);
    wg.connect(out);
    src.start();
    lfo.start();
  }

  // Колокол: неровный ряд обертонов, как у литой бронзы.
  const PARTIALS = [[0.5,0.5,9],[1,1,6],[1.19,0.55,4],[1.5,0.35,3.2],[2,0.4,2.6],[2.51,0.2,1.8],[2.66,0.18,1.5],[3.01,0.12,1.2],[4.1,0.08,0.8]];
  const BELL_NOTES = [98, 110, 130.8, 146.8, 196];

  function bell(freq, vol, when = 0) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime + when;
    const pan = ac.createStereoPanner();
    pan.pan.value = (Math.random() - 0.5) * 0.8;
    pan.connect(muffle);
    for (const [ratio, amp, decay] of PARTIALS) {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.frequency.value = freq * ratio * (1 + (Math.random() - 0.5) * 0.004);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp * vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      o.connect(g);
      g.connect(pan);
      o.start(t);
      o.stop(t + decay + 0.05);
      o.onended = () => { o.disconnect(); g.disconnect(); };
    }
  }

  function peal(n, gap) {
    for (let i = 0; i < n; i++) bell(BELL_NOTES[(n - i + 2) % BELL_NOTES.length] * 2, 0.11, i * gap);
  }

  function noiseBurst(dur, freq, q, vol, when = 0) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime + when;
    const n = Math.floor(ac.sampleRate * dur);
    const b = ac.createBuffer(1, n, ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const s = ac.createBufferSource();
    s.buffer = b;
    const f = ac.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q;
    const g = ac.createGain();
    g.gain.value = vol;
    s.connect(f);
    f.connect(g);
    g.connect(out);
    s.start(t);
    s.onended = () => { s.disconnect(); f.disconnect(); g.disconnect(); };
  }

  function plop() {
    if (!ac || !soundOn) return;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.frequency.setValueAtTime(720, t);
    o.frequency.exponentialRampToValueAtTime(170, t + 0.16);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g);
    g.connect(out);
    o.start(t);
    o.stop(t + 0.3);
    o.onended = () => { o.disconnect(); g.disconnect(); };
    noiseBurst(0.25, 1400, 1.2, 0.08, 0.02);
  }

  function creak(duration) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(62, t);
    for (let i = 1; i < 14; i++) o.frequency.linearRampToValueAtTime(55 + Math.random() * 60, t + duration * i / 14);
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 820;
    bp.Q.value = 6;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.15);
    g.gain.linearRampToValueAtTime(0.06, t + duration * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    o.connect(bp);
    bp.connect(g);
    g.connect(out);
    o.start(t);
    o.stop(t + duration + 0.05);
    o.onended = () => { o.disconnect(); bp.disconnect(); g.disconnect(); };
  }

  function setMuffle(hz, delay = 0) {
    if (muffle) muffle.frequency.setTargetAtTime(hz, ac.currentTime + delay, 0.5);
  }

  async function setSound(on) {
    initAudio();
    soundOn = on;
    if (on) await ac.resume(); else await ac.suspend();
    $('#sound').setAttribute('aria-pressed', on);
    $('#sound').textContent = on ? '♫ Звон слышен' : '♫ Звон';
    if (on) bell(BELL_NOTES[2], 0.14);
  }
  $('#sound').onclick = () => setSound(!soundOn).catch(() => { $('#sound').textContent = 'Звук недоступен'; });

  let firstGesture = true;
  function wakeSound() {
    if (firstGesture) { firstGesture = false; if (!ac) setSound(true).catch(() => {}); }
  }

  /* ============================== ПЕРЕХОДЫ И ИНТЕРФЕЙС ============================== */

  const st = { push: 0, enter: 0 };
  let where = 'gate';
  let isOpen = false, hover = false, busy = false;
  const touch = matchMedia('(pointer: coarse)').matches;

  const ui = {
    toggle: $('#toggle'), enter: $('#enter'), exit: $('#exit'), stick: $('#stick'),
    legend: $('#legend'), subtitle: $('#subtitle'), flash: $('#flash')
  };

  const GATE_LEGEND = 'Говорят, в тихую ночь из-под воды слышен колокольный звон, а тем, кто чист сердцем, град открывает свои ворота.';
  const CITY_LEGEND = touch
    ? 'Джойстик слева — грести и поворачивать. Проведите по экрану, чтобы оглядеться.'
    : 'W A S D или стрелки — грести и поворачивать. Тяните мышью, чтобы оглядеться, колесо — ближе или дальше.';

  function toggle() {
    if (busy || where !== 'gate') return;
    wakeSound();
    isOpen = !isOpen;
    const leaves = gate.leaves;
    gsap.killTweensOf(leaves.map(l => l.uAngle));
    gsap.killTweensOf([gate.uni.uGlow, st]);

    if (isOpen) {
      // Сначала короткий толчок у засова, затем створки тяжело расходятся.
      leaves.forEach((l, i) => {
        gsap.timeline({ delay: i * 0.18 * K })
          .to(l.uAngle, { value: 0.06, duration: 0.25 * K, ease: 'power1.out' })
          .to(l.uAngle, { value: 1.62 - i * 0.07, duration: 2.6 * K, ease: 'power2.inOut' }, '+=' + 0.2 * K);
      });
      gsap.to(gate.uni.uGlow, { value: 1, duration: 3 * K, delay: 0.3 * K, ease: 'power1.inOut' });
      gsap.to(st, { push: 1, duration: 3.6 * K, ease: 'power2.inOut' });
      creak(2.6 * K);
      setMuffle(5200, 0.4);
      setTimeout(() => peal(5, 0.55), 900 * K);
      loadBabylon().catch(() => {});
    } else {
      leaves.forEach((l, i) => gsap.to(l.uAngle, { value: 0, duration: 2.2 * K, delay: (1 - i) * 0.15 * K, ease: 'power2.inOut' }));
      gsap.to(gate.uni.uGlow, { value: 0, duration: 2.4 * K, ease: 'power1.inOut' });
      gsap.to(st, { push: 0, duration: 2.8 * K, ease: 'power2.inOut' });
      creak(2 * K);
      setMuffle(520, 1.6);
    }
    ui.toggle.textContent = isOpen ? 'Закрыть двери' : 'Открыть двери';
    ui.enter.hidden = !isOpen;
    ui.legend.classList.toggle('on', isOpen);
  }
  ui.toggle.onclick = toggle;

  let legendTimer = 0;
  // Пролёт сквозь сени: камера уходит в проём, кадр заливает золотом, за ним — лодка у ворот града.
  function enterCity() {
    if (busy || !isOpen || where !== 'gate') return;
    busy = true;
    wakeSound();
    ui.toggle.hidden = ui.enter.hidden = true;
    ui.legend.classList.remove('on');
    gsap.to(st, { enter: 1, duration: 2.4 * K, ease: 'power2.in' });
    // Движок догружается под золотой вспышкой, если ещё не успел.
    const flashed = new Promise(ok => gsap.to(ui.flash, { opacity: 1, duration: 1.1 * K, delay: 1.3 * K, ease: 'power1.in', onComplete: ok }));
    Promise.all([flashed, loadBabylon()]).then(() => {
      if (!world) {
        world = createWorld();
        world.onSplash = s => noiseBurst(0.22, 650, 0.9, 0.05 + 0.07 * s);
      }
      {
        where = 'city';
        world.enter();
        hover = false;
        $('#stage').classList.remove('hot');
        $('#stage').style.visibility = 'hidden';   // сцена дверей не должна перекрывать город
        ui.subtitle.textContent = 'Невидимый град';
        ui.legend.textContent = CITY_LEGEND;
        gsap.to(ui.flash, {
          opacity: 0, duration: 1.8 * K, ease: 'power1.out',
          onComplete: () => {
            busy = false;
            ui.exit.hidden = false;
            ui.stick.hidden = !touch;
            ui.legend.classList.add('on');
            clearTimeout(legendTimer);
            legendTimer = setTimeout(() => { if (where === 'city') ui.legend.classList.remove('on'); }, 9000);
          }
        });
        setMuffle(9000);
        peal(4, 0.7);
      }
    }).catch(err => {
      console.error(err);
      busy = false;
      st.enter = 0;
      gsap.to(ui.flash, { opacity: 0, duration: 0.8 });
      ui.toggle.hidden = ui.enter.hidden = false;
      ui.legend.textContent = 'Не удалось загрузить игровой движок. Проверьте интернет и попробуйте ещё раз.';
      ui.legend.classList.add('on');
    });
  }
  ui.enter.onclick = enterCity;

  function leaveCity() {
    if (busy || where !== 'city') return;
    busy = true;
    ui.exit.hidden = ui.stick.hidden = true;
    ui.legend.classList.remove('on');
    world.leave();
    gsap.to(ui.flash, {
      opacity: 1, duration: 1.1 * K, ease: 'power1.in',
      onComplete: () => {
        where = 'gate';
        $('#stage').style.visibility = '';
        st.enter = 0.75;
        ui.subtitle.textContent = 'Невидимый град на озере Светлояр';
        ui.legend.textContent = GATE_LEGEND;
        gsap.to(st, { enter: 0, duration: 2.8 * K, ease: 'power2.out' });
        gsap.to(ui.flash, {
          opacity: 0, duration: 1.6 * K, ease: 'power1.out',
          onComplete: () => {
            busy = false;
            ui.toggle.hidden = ui.enter.hidden = false;
            ui.legend.classList.add('on');
          }
        });
        setMuffle(5200);
      }
    });
  }
  ui.exit.onclick = leaveCity;

  // Джойстик для телефона: отклонение ручки — грести вперёд/назад и поворачивать.
  (function joystick() {
    const el = ui.stick, knob = el.querySelector('i');
    let id = null, cx = 0, cy = 0;
    const move = e => {
      if (e.pointerId !== id) return;
      let dx = (e.clientX - cx) / 46, dy = (e.clientY - cy) / 46;
      const m = Math.hypot(dx, dy);
      if (m > 1) { dx /= m; dy /= m; }
      knob.style.transform = `translate(${dx * 36}px, ${dy * 36}px)`;
      if (world) world.setStick(dx, -dy);
    };
    el.addEventListener('pointerdown', e => {
      id = e.pointerId;
      el.setPointerCapture(id);
      const r = el.getBoundingClientRect();
      cx = r.left + r.width / 2;
      cy = r.top + r.height / 2;
      move(e);
    });
    el.addEventListener('pointermove', move);
    const end = e => {
      if (e.pointerId !== id) return;
      id = null;
      knob.style.transform = '';
      if (world) world.setStick(0, 0);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  })();


  /* ============================== УКАЗАТЕЛЬ ============================== */

  const ndc = new THREE.Vector2();
  const ray = new THREE.Raycaster();
  const zPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const hit = new THREE.Vector3();
  const look = { x: 0, y: 0 };

  function pointerToPx(e) {
    ndc.set(e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2);
    ray.setFromCamera(ndc, camera);
    if (!ray.ray.intersectPlane(zPlane, hit)) return null;
    return { x: hit.x * 100 + IW / 2, y: IH / 2 - hit.y * 100 };
  }

  const stage = $('#stage');
  stage.addEventListener('pointermove', e => {
    look.x = e.clientX / innerWidth * 2 - 1;
    look.y = 1 - e.clientY / innerHeight * 2;
    if (busy || where !== 'gate') return;
    hover = gate.isOver(pointerToPx(e));
    stage.classList.toggle('hot', !!hover);
  });
  stage.addEventListener('pointerleave', () => { hover = false; look.x = look.y = 0; stage.classList.remove('hot'); });
  stage.addEventListener('click', e => {
    if (busy || where !== 'gate') return;
    if (gate.isOver(pointerToPx(e))) toggle();
  });

  /* ============================== КАМЕРА И КАДР ============================== */

  let fitZ = 10;
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    // Кадр чуть крупнее экрана, чтобы параллаксу было куда сдвигаться без пустых краёв.
    const visH = Math.min(IH / 100, (IW / 100) / camera.aspect) * 0.92;
    fitZ = visH / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
    gate.sparkMat.uniforms.uPx.value = renderer.getPixelRatio() * h / 800;
    if (world) world.resize();
  }
  addEventListener('resize', resize);
  resize();

  const camPos = new THREE.Vector3(0, 0, fitZ);
  const camAim = new THREE.Vector3();
  const tmp = new THREE.Vector3();
  const halfTan = () => Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  let last = performance.now(), stopped = false, lastWhere = where;

  function clampToPhoto(x, y, z) {
    const halfH = z * halfTan();
    const halfW = halfH * camera.aspect;
    const maxX = Math.max(0, IW / 200 - halfW), maxY = Math.max(0, IH / 200 - halfH);
    return [THREE.MathUtils.clamp(x, -maxX, maxX), THREE.MathUtils.clamp(y, -maxY, maxY)];
  }

  // Звуки града: колокол ближайшей башни и треск ближнего костра, тише с расстоянием.
  function citySounds(dt) {
    const me = world.boatPos();
    bellTimer -= dt;
    if (bellTimer <= 0) {
      bellTimer = 7 + Math.random() * 8;
      let best = null, bd = Infinity;
      for (const b of world.bells) { const d = b.distanceTo(me); if (d < bd) { bd = d; best = b; } }
      if (best) bell(BELL_NOTES[Math.floor(Math.random() * BELL_NOTES.length)] * 2, 0.04 + 0.16 * Math.max(0, 1 - bd / 90));
    }
    crackleTimer -= dt;
    if (crackleTimer <= 0) {
      crackleTimer = 0.08 + Math.random() * 0.45;
      let fd = Infinity;
      for (const f of world.fires) fd = Math.min(fd, f.distanceTo(me));
      const v = Math.max(0, 1 - fd / 28);
      if (v > 0.02) noiseBurst(0.04 + Math.random() * 0.05, 1800 + Math.random() * 2500, 2, (0.04 + Math.random() * 0.06) * v);
    }
  }

  function frame(now) {
    if (stopped) return;
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    clock.value += dt;
    const par = reduced ? 0 : 1;

    // При смене сцены камера встаёт сразу на нужное место, без пролёта через полэкрана.
    const snap = lastWhere !== where;
    lastWhere = where;

    if (where === 'gate') {
      const ajar = hover && !isOpen && st.push < 0.01 ? 0.045 : 0;
      gate.leaves.forEach(l => {
        if (!gsap.isTweening(l.uAngle) && !isOpen) l.uAngle.value += (ajar - l.uAngle.value) * (1 - Math.exp(-dt * 6));
        l.pivot.rotation.y = l.sign * l.uAngle.value;
      });

      const p = st.push;
      const zOpen = fitZ * (1 - 0.36 * p);
      if (st.enter > 0) {
        // Влёт в сени: ось камеры идёт точно в центр проёма.
        const e = st.enter;
        const [cx, cy] = clampToPhoto(gate.DOOR_X * p, gate.DOOR_CY * 0.7 * p, zOpen);
        tmp.set(THREE.MathUtils.lerp(cx, gate.DOOR_X, e), THREE.MathUtils.lerp(cy, gate.DOOR_CY + 0.1, e), THREE.MathUtils.lerp(zOpen, -1.4, e));
        camPos.copy(tmp);
      } else {
        const [cx, cy] = clampToPhoto(gate.DOOR_X * p + look.x * 0.14 * par, gate.DOOR_CY * 0.7 * p + look.y * 0.07 * par, zOpen);
        tmp.set(cx, cy, zOpen);
        if (snap) camPos.copy(tmp); else camPos.lerp(tmp, 1 - Math.exp(-dt * 3));
      }
      camera.position.copy(camPos);
      camAim.set(camPos.x, camPos.y, camPos.z - 10);
      camera.lookAt(camAim);

      if (soundOn) {
        bellTimer -= dt;
        if (bellTimer <= 0) {
          bell(BELL_NOTES[Math.floor(Math.random() * BELL_NOTES.length)], isOpen ? 0.08 : 0.16);
          bellTimer = 8 + Math.random() * 9;
        }
      }
      renderer.render(gate.scene, camera);
    } else {
      // Град рисует Babylon в своём холсте и своём цикле; здесь только звук.
      if (soundOn && world) citySounds(dt);
    }
  }

  renderer.domElement.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    stopped = true;
    fail('WebGL-контекст потерян. Перезагрузите страницу.');
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (ac) ac.suspend(); }
    else { last = performance.now(); if (ac && soundOn) ac.resume().catch(() => {}); }
  });

  requestAnimationFrame(frame);
  requestAnimationFrame(() => veil.classList.add('gone'));
}
</script>
</body>
</html>
