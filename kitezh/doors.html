<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Врата Китежа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap">
<style>
/* Один кадр во весь экран; интерфейс — тихие подписи по краям, как титры к фильму */
:root{
  color-scheme:dark;
  --night:#060b10;
  --bone:#e9e1cf;
  --mist:#9fb0b8;
  --ember:#e7b56a;
  --line:#e9e1cf2e;
  --glass:#060b10a8;
  --display:'Cormorant SC','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:manipulation}
#stage canvas{display:block;width:100%;height:100%}
#stage.hot{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:4px}

.title{
  position:fixed;
  top:calc(28px + env(safe-area-inset-top,0px));
  left:max(28px,env(safe-area-inset-left,0px));
  pointer-events:none;text-shadow:0 2px 18px #000
}
.title h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,4vw,52px);letter-spacing:.32em;margin:0;line-height:1}
.title p{margin:10px 0 0;font-style:italic;font-size:17px;color:var(--mist);letter-spacing:.04em}

#sound{
  position:fixed;
  top:calc(28px + env(safe-area-inset-top,0px));
  right:max(28px,env(safe-area-inset-right,0px));
  background:var(--glass);border:1px solid var(--line);border-radius:99px;
  padding:9px 16px;font-family:var(--display);font-size:14px;letter-spacing:.16em;
  backdrop-filter:blur(10px)
}
#sound[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}

.foot{
  position:fixed;left:0;right:0;
  bottom:calc(26px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;text-align:center
}
#legend{
  max-width:34em;margin:0;font-style:italic;font-size:clamp(16px,1.6vw,20px);line-height:1.45;
  color:var(--bone);text-shadow:0 2px 14px #000,0 0 30px #000;
  opacity:0;transform:translateY(8px);transition:opacity 1.6s ease,transform 1.6s ease
}
#legend.on{opacity:.92;transform:none}
#toggle{
  pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:99px;
  padding:11px 22px;font-family:var(--display);font-size:15px;letter-spacing:.2em;
  backdrop-filter:blur(10px);transition:border-color .3s,color .3s
}
#toggle:hover{border-color:var(--ember);color:var(--ember)}

#veil{position:fixed;inset:0;background:var(--night);display:grid;place-content:center;
  font-family:var(--display);letter-spacing:.4em;color:var(--ember);transition:opacity 1.2s ease;z-index:5}
#veil.gone{opacity:0;pointer-events:none}
#veil p{max-width:440px;padding:24px;line-height:1.7;letter-spacing:.05em;font-family:var(--body);color:var(--bone);text-align:center}

@media (max-width:640px){
  .title p{font-size:15px}
  #sound{padding:8px 12px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  #legend{transition:none}
}
</style>
</head>
<body>
<div id="stage" aria-label="Деревянный терем Китежа, стоящий в озере. Двери можно открыть."></div>

<div class="title">
  <h1>Китеж</h1>
  <p>Невидимый град на озере Светлояр</p>
</div>

<button id="sound" aria-pressed="false">♫ Звон</button>

<div class="foot">
  <p id="legend">Говорят, в тихую ночь из-под воды слышен колокольный звон, а тем, кто чист сердцем, град открывает свои ворота.</p>
  <button id="toggle">Открыть двери</button>
</div>

<div id="veil">КИТЕЖ</div>

if (!window.THREE || !window.gsap) {
  fail('Не удалось загрузить Three.js и GSAP. Откройте страницу с доступом к интернету.');
} else {
  const img = new Image();
  img.onload = () => { try { boot(img); } catch (e) { console.error(e); fail('Сцена не запустилась: ' + e.message + '. Нужен браузер с WebGL.'); } };
  img.onerror = () => fail('Не удалось прочитать изображение.');
  img.src = PHOTO;
}

function boot(img) {
  // Фото 1024×572: 1 пиксель = 0.01 единицы сцены, центр кадра в нуле.
  const IW = 1024, IH = 572;
  const X = px => (px - IW / 2) / 100;
  const Y = py => (IH / 2 - py) / 100;

  // Проём дверей и линия воды, снятые с фотографии.
  const DOOR = { l: 451, r: 579, t: 317, b: 440 };
  const WATER = 440;
  const DOOR_W = (DOOR.r - DOOR.l) / 100;
  const DOOR_H = (DOOR.b - DOOR.t) / 100;
  const LEAF_W = DOOR_W / 2;
  const DOOR_CY = Y((DOOR.t + DOOR.b) / 2);
  const DEPTH = 2.6;

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x060b10);
  $('#stage').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);

  const photo = new THREE.Texture(img);
  photo.colorSpace = THREE.NoColorSpace;
  photo.minFilter = THREE.LinearFilter;
  photo.generateMipmaps = false;
  photo.needsUpdate = true;

  // Фонари и их отражения: x, y на фото и фаза мерцания (у отражения — фаза источника).
  const lamps = [
    [513,237,0.1],[612,328,1.3],[418,329,2.6],[791,358,3.4],[221,363,4.7],[343,241,5.9],
    [413,544,2.6],[614,547,1.3],[413,567,2.6],[614,569,1.3]
  ].map(v => new THREE.Vector3(...v));

  const uni = {
    uMap: { value: photo },
    uTime: { value: 0 },
    uGlow: { value: 0 },
    uLamps: { value: lamps },
    uDoor: { value: new THREE.Vector4(DOOR.l, DOOR.t, DOOR.r, DOOR.b) }
  };

  const common = `
    uniform sampler2D uMap;
    uniform float uTime;
    uniform float uGlow;
    uniform vec3 uLamps[10];
    const vec3 WARM = vec3(1.0, 0.68, 0.34);

    vec2 toPx(vec2 uv) { return vec2(uv.x * 1024.0, (1.0 - uv.y) * 572.0); }
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
    }
    // Мерцание только у тёплых светлых пикселей рядом с фонарями.
    vec3 flicker(vec3 c, vec2 px) {
      float k = 0.0;
      for (int i = 0; i < 10; i++) {
        vec3 l = uLamps[i];
        float d = distance(px, l.xy);
        float w = exp(-d * d / 800.0);
        float f = sin(uTime * 7.1 + l.z * 3.0) * 0.5 + sin(uTime * 13.7 + l.z * 5.0) * 0.3
                + (noise(vec2(uTime * 5.0 + l.z * 10.0, l.z)) - 0.5);
        k += w * f;
      }
      float lum = dot(c, vec3(0.3, 0.59, 0.11));
      float warm = smoothstep(0.2, 0.65, lum) * clamp((c.r - c.b) * 3.0, 0.0, 1.0);
      return c * (1.0 + k * 0.28 * warm);
    }
  `;

  const passUv = `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `;

  // ФОТО: фасад с вырезанным проёмом, рябь воды и отсвет из дверей.
  const photoMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(IW / 100, IH / 100, 1, 1),
    new THREE.ShaderMaterial({
      uniforms: uni,
      vertexShader: passUv,
      fragmentShader: common + `
        uniform vec4 uDoor;
        varying vec2 vUv;
        void main() {
          vec2 uv = vUv;
          vec2 px = toPx(uv);
          if (px.x > uDoor.x && px.x < uDoor.z && px.y > uDoor.y && px.y < uDoor.w) discard;

          float below = px.y - 440.0;
          if (below > 0.0) {
            float a = (0.6 + 1.8 * below / 132.0) * smoothstep(0.0, 6.0, below);
            uv.x += (sin(px.y * 0.55 - uTime * 1.6 + noise(px * vec2(0.02, 0.15) + uTime * 0.3) * 5.0) * 0.0011
                   + (noise(vec2(px.x * 0.01, px.y * 0.08 - uTime * 0.6)) - 0.5) * 0.0025) * a;
            uv.y += sin(px.x * 0.05 + uTime * 1.1 + px.y * 0.2) * 0.0009 * a;
          }

          vec3 c = flicker(texture2D(uMap, uv).rgb, px);

          // Тёплый свет на брёвнах вокруг проёма.
          float facade = exp(-pow(length((px - vec2(515.0, 395.0)) / vec2(115.0, 80.0)), 2.0)) * step(px.y, 440.0);
          c += WARM * facade * uGlow * (c * 1.4 + 0.03);

          // Дорожка света на воде.
          if (below > 0.0) {
            float wob = (noise(vec2(px.y * 0.09 - uTime * 0.9, 1.0)) - 0.5) * 34.0 * (below / 132.0);
            float dx = (px.x - 515.0 + wob) / (60.0 + below * 0.4);
            float streak = exp(-dx * dx * 2.5) * exp(-below / 150.0);
            float br = 0.5 + 0.5 * sin(px.y * 1.1 + uTime * 2.3 + noise(px * 0.05) * 4.0);
            c += WARM * streak * br * 0.8 * uGlow;
          }
          gl_FragColor = vec4(c, 1.0);
        }
      `
    })
  );
  scene.add(photoMesh);

  // ВНУТРИ: сени из брёвен, вода на полу и сияние града в глубине.
  function backWall() {
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const g = c.getContext('2d');
    let q = g.createRadialGradient(256, 300, 10, 256, 300, 380);
    q.addColorStop(0, '#fff6dc');
    q.addColorStop(0.25, '#ffd58a');
    q.addColorStop(0.6, '#b9732e');
    q.addColorStop(1, '#3a1f0c');
    g.fillStyle = q;
    g.fillRect(0, 0, 512, 512);

    // Силуэт далёкого града: главы, барабаны и шатры в золотом тумане.
    g.fillStyle = 'rgba(120,70,25,0.55)';
    const domes = [[70,300,26],[130,268,34],[200,240,40],[256,200,52],[318,236,40],[384,262,34],[446,298,26]];
    g.beginPath();
    g.moveTo(0, 360);
    for (const [x, y, r] of domes) {
      g.lineTo(x - r * 0.8, 360);
      g.lineTo(x - r * 0.8, y + r * 1.2);
      g.lineTo(x - r * 0.55, y + r * 1.2);
      g.bezierCurveTo(x - r * 1.05, y + r * 0.3, x - r * 0.25, y - r * 0.35, x, y - r * 1.05);
      g.bezierCurveTo(x + r * 0.25, y - r * 0.35, x + r * 1.05, y + r * 0.3, x + r * 0.55, y + r * 1.2);
      g.lineTo(x + r * 0.8, y + r * 1.2);
      g.lineTo(x + r * 0.8, 360);
    }
    g.lineTo(512, 360);
    g.lineTo(512, 512);
    g.lineTo(0, 512);
    g.fill();
    for (const [x, y, r] of domes) {
      g.fillRect(x - 1.5, y - r * 1.6, 3, r * 0.6);
      g.fillRect(x - r * 0.18, y - r * 1.42, r * 0.36, 3);
    }
    // Окна, горящие в дымке.
    for (let i = 0; i < 60; i++) {
      const [x, y, r] = domes[i % domes.length];
      g.fillStyle = `rgba(255,236,180,${0.35 + Math.random() * 0.4})`;
      g.fillRect(x - r * 0.6 + Math.random() * r * 1.2, y + r * 1.3 + Math.random() * (360 - y - r * 1.4), 3, 5);
    }
    // Туман поверх силуэтов.
    q = g.createLinearGradient(0, 220, 0, 512);
    q.addColorStop(0, 'rgba(255,230,170,0)');
    q.addColorStop(0.55, 'rgba(255,220,150,0.45)');
    q.addColorStop(1, 'rgba(120,70,30,0.6)');
    g.fillStyle = q;
    g.fillRect(0, 0, 512, 512);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.NoColorSpace;
    return t;
  }

  const roomW = DOOR_W + 0.12, roomH = DOOR_H + 0.08;
  const room = new THREE.Mesh(
    new THREE.BoxGeometry(roomW, roomH, DEPTH),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: { ...uni, uBack: { value: backWall() }, uSize: { value: new THREE.Vector3(roomW, roomH, DEPTH) } },
      vertexShader: `
        varying vec3 vP; varying vec3 vN;
        void main() { vP = position; vN = normal; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
      `,
      fragmentShader: common + `
        uniform sampler2D uBack;
        uniform vec3 uSize;
        varying vec3 vP; varying vec3 vN;
        void main() {
          float t = clamp((uSize.z * 0.5 - vP.z) / uSize.z, 0.0, 1.0);
          float glow = 0.25 + 0.75 * uGlow;
          vec3 c;
          if (vN.z < -0.5) {
            c = texture2D(uBack, vP.xy / uSize.xy + 0.5).rgb * glow;
          } else if (abs(vN.x) > 0.5) {
            float f = fract((vP.y + uSize.y * 0.5) / 0.115);
            float lg = smoothstep(0.0, 0.18, f) * smoothstep(1.0, 0.72, f);
            float grain = 0.8 + 0.4 * noise(vec2(vP.z * 30.0, vP.y * 9.0));
            c = vec3(0.16, 0.1, 0.055) * (0.3 + 0.7 * lg) * grain * (0.4 + 3.2 * t * t) * glow;
          } else if (vP.y > 0.0) {
            float beam = step(0.75, fract(vP.z * 3.0));
            c = vec3(0.07, 0.045, 0.025) * (1.0 - 0.5 * beam) * (0.4 + 2.5 * t * t) * glow;
          } else {
            float r = noise(vec2(vP.x * 9.0, vP.z * 16.0 + uTime * 0.8));
            float sheen = pow(r, 3.0);
            c = vec3(0.012, 0.02, 0.025) + WARM * (0.1 + 0.9 * t * t) * (0.3 + 1.4 * sheen) * glow;
          }
          c = mix(c, WARM * 1.05 * glow, smoothstep(0.25, 1.0, t) * 0.4);
          gl_FragColor = vec4(c, 1.0);
        }
      `
    })
  );
  room.position.set(X((DOOR.l + DOOR.r) / 2), Y(WATER) + roomH / 2, -DEPTH / 2 - 0.002);
  scene.add(room);

  // СТВОРКИ: тот же фрагмент фото на петлях, плюс торец толщиной 5 см.
  function leaf(side) {
    const pivot = new THREE.Group();
    const left = side < 0;
    const px0 = left ? DOOR.l : (DOOR.l + DOOR.r) / 2;
    const px1 = left ? (DOOR.l + DOOR.r) / 2 : DOOR.r;
    pivot.position.set(X(left ? DOOR.l : DOOR.r), DOOR_CY, 0);

    const shift = left ? LEAF_W / 2 : -LEAF_W / 2;
    const leafUni = {
      ...uni,
      uRect: { value: new THREE.Vector4(px0 / IW, 1 - DOOR.b / IH, px1 / IW, 1 - DOOR.t / IH) },
      uAngle: { value: 0 },
      uFreeU: { value: left ? 1 : 0 }
    };

    const face = new THREE.Mesh(
      new THREE.PlaneGeometry(LEAF_W, DOOR_H).translate(shift, 0, 0),
      new THREE.ShaderMaterial({
        uniforms: leafUni,
        vertexShader: passUv,
        fragmentShader: common + `
          uniform vec4 uRect;
          uniform float uAngle;
          uniform float uFreeU;
          varying vec2 vUv;
          void main() {
            vec2 uv = mix(uRect.xy, uRect.zw, vUv);
            vec3 c = flicker(texture2D(uMap, uv).rgb, toPx(uv));
            float s = sin(uAngle);
            float deep = mix(1.0 - vUv.x, vUv.x, uFreeU);
            c *= 1.0 - 0.3 * s;
            c += WARM * uGlow * s * (0.25 + 0.75 * deep) * (c * 2.2 + 0.04);
            gl_FragColor = vec4(c, 1.0);
          }
        `
      })
    );

    const slab = new THREE.Mesh(
      new THREE.BoxGeometry(LEAF_W, DOOR_H, 0.05).translate(shift, 0, -0.026),
      new THREE.ShaderMaterial({
        uniforms: uni,
        vertexShader: passUv,
        fragmentShader: `
          uniform float uGlow;
          void main() { gl_FragColor = vec4(vec3(0.07, 0.045, 0.03) + vec3(0.25, 0.15, 0.07) * uGlow, 1.0); }
        `
      })
    );

    pivot.add(face, slab);
    scene.add(pivot);
    return { pivot, uAngle: leafUni.uAngle, sign: left ? 1 : -1 };
  }

  const leaves = [leaf(-1), leaf(1)];

  // ИСКРЫ: золотая пыль, которую выносит из сеней наружу.
  const SPARKS = 180;
  const seeds = new Float32Array(SPARKS * 4);
  for (let i = 0; i < seeds.length; i++) seeds[i] = Math.random();
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SPARKS * 3), 3));
  sparkGeo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));
  const sparkMat = new THREE.ShaderMaterial({
    uniforms: { ...uni, uPx: { value: 1 }, uCenter: { value: new THREE.Vector3(X(515), Y(WATER), 0) } },
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute vec4 aSeed;
      uniform float uTime, uGlow, uPx;
      uniform vec3 uCenter;
      varying float vA;
      void main() {
        float life = fract(uTime * (0.05 + aSeed.w * 0.07) + aSeed.x * 7.0);
        vec3 p = uCenter;
        p.x += (aSeed.x - 0.5) * 1.1 * (1.0 + life * 1.6) + sin(uTime * 0.7 + aSeed.y * 20.0) * 0.06;
        p.y += 0.06 + aSeed.y * 1.1 + life * 0.5 + sin(uTime * 0.9 + aSeed.z * 20.0) * 0.04;
        p.z = mix(-2.3, 2.2, life) * (0.6 + aSeed.z * 0.4);
        vA = sin(life * 3.14159) * uGlow * (0.4 + 0.6 * aSeed.z);
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = (2.0 + aSeed.y * 4.0) * uPx * (8.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying float vA;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        gl_FragColor = vec4(vec3(1.0, 0.78, 0.45) * smoothstep(0.5, 0.0, d) * vA, 1.0);
      }
    `
  });
  const sparks = new THREE.Points(sparkGeo, sparkMat);
  sparks.frustumCulled = false;
  scene.add(sparks);

  // ТУМАН над водой, тёплый у дверей, когда они открыты.
  const fog = new THREE.Mesh(
    new THREE.PlaneGeometry(IW / 100, IH / 100),
    new THREE.ShaderMaterial({
      uniforms: uni,
      transparent: true,
      depthWrite: false,
      vertexShader: passUv,
      fragmentShader: common + `
        varying vec2 vUv;
        float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }
        void main() {
          vec2 px = toPx(vUv);
          float band = exp(-pow((px.y - 425.0) / 75.0, 2.0));
          float f = fbm(px * vec2(0.006, 0.02) + vec2(uTime * 0.03, uTime * 0.004));
          float a = band * smoothstep(0.3, 0.8, f) * 0.42;
          float near = exp(-pow(length((px - vec2(515.0, 425.0)) / vec2(190.0, 70.0)), 2.0));
          vec3 col = mix(vec3(0.38, 0.44, 0.5), WARM * 1.2, uGlow * near);
          gl_FragColor = vec4(col, a * (1.0 + uGlow * near * 0.8));
        }
      `
    })
  );
  fog.position.z = 0.012;
  scene.add(fog);

  // ЗВУК: вода, колокола из-под воды, скрип створок. Всё синтезируется.
  let ac = null, out = null, muffle = null, soundOn = false, bellTimer = 0;

  function initAudio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    out = ac.createGain();
    out.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    out.connect(comp);
    comp.connect(ac.destination);

    muffle = ac.createBiquadFilter();
    muffle.type = 'lowpass';
    muffle.frequency.value = 520;
    muffle.connect(out);

    // Плеск: коричневый шум через низкочастотный фильтр.
    const len = ac.sampleRate * 4;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 380;
    const wg = ac.createGain();
    wg.gain.value = 0.22;
    const lfo = ac.createOscillator();
    const lfoGain = ac.createGain();
    lfo.frequency.value = 0.13;
    lfoGain.gain.value = 0.08;
    lfo.connect(lfoGain);
    lfoGain.connect(wg.gain);
    src.connect(lp);
    lp.connect(wg);
    wg.connect(out);
    src.start();
    lfo.start();
  }

  // Колокол: неровный ряд обертонов, как у литой бронзы.
  const PARTIALS = [[0.5,0.5,9],[1,1,6],[1.19,0.55,4],[1.5,0.35,3.2],[2,0.4,2.6],[2.51,0.2,1.8],[2.66,0.18,1.5],[3.01,0.12,1.2],[4.1,0.08,0.8]];
  function bell(freq, vol, when = 0) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime + when;
    const pan = ac.createStereoPanner();
    pan.pan.value = (Math.random() - 0.5) * 0.8;
    pan.connect(muffle);
    for (const [ratio, amp, decay] of PARTIALS) {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.frequency.value = freq * ratio * (1 + (Math.random() - 0.5) * 0.004);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp * vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      o.connect(g);
      g.connect(pan);
      o.start(t);
      o.stop(t + decay + 0.05);
      o.onended = () => { o.disconnect(); g.disconnect(); };
    }
  }

  const BELL_NOTES = [98, 110, 130.8, 146.8, 196];
  function peal(n, gap) {
    for (let i = 0; i < n; i++) bell(BELL_NOTES[(n - i + 2) % BELL_NOTES.length] * 2, 0.11, i * gap);
  }

  function creak(duration) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(62, t);
    for (let i = 1; i < 14; i++) o.frequency.linearRampToValueAtTime(55 + Math.random() * 60, t + duration * i / 14);
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 820;
    bp.Q.value = 6;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.15);
    g.gain.linearRampToValueAtTime(0.06, t + duration * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    o.connect(bp);
    bp.connect(g);
    g.connect(out);
    o.start(t);
    o.stop(t + duration + 0.05);
    o.onended = () => { o.disconnect(); bp.disconnect(); g.disconnect(); };
  }

  async function setSound(on) {
    initAudio();
    soundOn = on;
    if (on) await ac.resume(); else await ac.suspend();
    $('#sound').setAttribute('aria-pressed', on);
    $('#sound').textContent = on ? '♫ Звон слышен' : '♫ Звон';
    if (on) bell(BELL_NOTES[2], 0.14);
  }
  $('#sound').onclick = () => setSound(!soundOn).catch(() => { $('#sound').textContent = 'Звук недоступен'; });

  // ДВЕРИ
  const st = { open: 0, push: 0 };
  let isOpen = false, hover = false, first = true;

  function toggle() {
    if (first) { first = false; if (!ac) setSound(true).catch(() => {}); }
    isOpen = !isOpen;
    const k = reduced ? 0.35 : 1;
    gsap.killTweensOf(leaves.map(l => l.uAngle));
    gsap.killTweensOf([uni.uGlow, st]);

    if (isOpen) {
      // Сначала короткий толчок у засова, затем створки тяжело расходятся.
      leaves.forEach((l, i) => {
        gsap.timeline({ delay: i * 0.18 * k })
          .to(l.uAngle, { value: 0.06, duration: 0.25 * k, ease: 'power1.out' })
          .to(l.uAngle, { value: 1.62 - i * 0.07, duration: 2.6 * k, ease: 'power2.inOut' }, '+=' + 0.2 * k);
      });
      gsap.to(uni.uGlow, { value: 1, duration: 3 * k, delay: 0.3 * k, ease: 'power1.inOut' });
      gsap.to(st, { push: 1, duration: 3.6 * k, ease: 'power2.inOut' });
      creak(2.6 * k);
      if (muffle) muffle.frequency.setTargetAtTime(5200, ac.currentTime + 0.4, 0.6);
      setTimeout(() => peal(5, 0.55), 900 * k);
    } else {
      leaves.forEach((l, i) => gsap.to(l.uAngle, { value: 0, duration: 2.2 * k, delay: (1 - i) * 0.15 * k, ease: 'power2.inOut' }));
      gsap.to(uni.uGlow, { value: 0, duration: 2.4 * k, ease: 'power1.inOut' });
      gsap.to(st, { push: 0, duration: 2.8 * k, ease: 'power2.inOut' });
      creak(2 * k);
      if (muffle) muffle.frequency.setTargetAtTime(520, ac.currentTime + 1.6, 0.4);
    }
    $('#toggle').textContent = isOpen ? 'Закрыть двери' : 'Открыть двери';
    $('#legend').classList.toggle('on', isOpen);
  }
  $('#toggle').onclick = toggle;

  // Указатель: щелчок по самим дверям тоже открывает их.
  const ndc = new THREE.Vector2();
  const ray = new THREE.Raycaster();
  const zPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const hit = new THREE.Vector3();
  const look = { x: 0, y: 0 };

  function pointerToPx(e) {
    ndc.set(e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2);
    ray.setFromCamera(ndc, camera);
    if (!ray.ray.intersectPlane(zPlane, hit)) return null;
    return { x: hit.x * 100 + IW / 2, y: IH / 2 - hit.y * 100 };
  }
  const onDoor = p => p && p.x > DOOR.l && p.x < DOOR.r && p.y > DOOR.t && p.y < DOOR.b;

  const stage = $('#stage');
  stage.addEventListener('pointermove', e => {
    look.x = e.clientX / innerWidth * 2 - 1;
    look.y = 1 - e.clientY / innerHeight * 2;
    hover = onDoor(pointerToPx(e));
    stage.classList.toggle('hot', hover);
  });
  stage.addEventListener('pointerleave', () => { hover = false; look.x = look.y = 0; stage.classList.remove('hot'); });
  stage.addEventListener('click', e => { if (onDoor(pointerToPx(e))) toggle(); });

  // КАМЕРА: кадр всегда заполняет экран, при открытии подаётся к дверям.
  let fitZ = 10;
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    // Чуть крупнее кадра, чтобы параллаксу было куда сдвигаться без пустых краёв.
    const visH = Math.min(IH / 100, (IW / 100) / camera.aspect) * 0.94;
    fitZ = visH / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
    sparkMat.uniforms.uPx.value = renderer.getPixelRatio() * h / 800;
  }
  addEventListener('resize', resize);
  resize();

  const camPos = new THREE.Vector3(0, 0, fitZ);
  const camAim = new THREE.Vector3();
  const tmp = new THREE.Vector3();
  let last = performance.now(), time = 0, stopped = false;

  function frame(now) {
    if (stopped) return;
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    time += dt;
    uni.uTime.value = time;

    // Лёгкое приоткрывание при наведении на закрытые двери.
    const ajar = hover && !isOpen && st.push < 0.01 ? 0.045 : 0;
    leaves.forEach(l => {
      if (!gsap.isTweening(l.uAngle) && !isOpen) l.uAngle.value += (ajar - l.uAngle.value) * (1 - Math.exp(-dt * 6));
      l.pivot.rotation.y = l.sign * l.uAngle.value;
    });

    const p = st.push;
    const par = reduced ? 0 : 1;
    // Камера сдвигается без наклона и не выходит за края фотографии.
    const z = fitZ * (1 - 0.36 * p);
    const halfH = z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const halfW = halfH * camera.aspect;
    const maxX = Math.max(0, IW / 200 - halfW), maxY = Math.max(0, IH / 200 - halfH);
    tmp.set(
      THREE.MathUtils.clamp(X(515) * p + look.x * 0.14 * par, -maxX, maxX),
      THREE.MathUtils.clamp(DOOR_CY * 0.7 * p + look.y * 0.07 * par, -maxY, maxY),
      z
    );
    camPos.lerp(tmp, 1 - Math.exp(-dt * 3));
    camera.position.copy(camPos);
    camAim.set(camPos.x, camPos.y, 0);
    camera.lookAt(camAim);

    // Колокол из-под воды иногда звучит и при закрытых дверях.
    if (soundOn) {
      bellTimer -= dt;
      if (bellTimer <= 0) {
        bell(BELL_NOTES[Math.floor(Math.random() * BELL_NOTES.length)], isOpen ? 0.08 : 0.16);
        bellTimer = 8 + Math.random() * 9;
      }
    }

    renderer.render(scene, camera);
  }

  renderer.domElement.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    stopped = true;
    fail('WebGL-контекст потерян. Перезагрузите страницу.');
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (ac) ac.suspend(); }
    else { last = performance.now(); if (ac && soundOn) ac.resume().catch(() => {}); }
  });

  requestAnimationFrame(frame);
  requestAnimationFrame(() => veil.classList.add('gone'));
}
</script>
</body>
</html>
