<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Врата Китежа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap">
<style>
/* Один кадр во весь экран; интерфейс — тихие подписи по краям, как титры к фильму */
:root{
  color-scheme:dark;
  --night:#060b10;
  --bone:#e9e1cf;
  --mist:#9fb0b8;
  --ember:#e7b56a;
  --line:#e9e1cf2e;
  --glass:#060b10a8;
  --display:'Cormorant SC','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:manipulation}
#stage canvas{display:block;width:100%;height:100%}
#stage.hot{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:4px}

.title{
  position:fixed;
  top:calc(28px + env(safe-area-inset-top,0px));
  left:max(28px,env(safe-area-inset-left,0px));
  pointer-events:none;text-shadow:0 2px 18px #000
}
.title h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,4vw,52px);letter-spacing:.32em;margin:0;line-height:1}
.title p{margin:10px 0 0;font-style:italic;font-size:17px;color:var(--mist);letter-spacing:.04em}

#sound{
  position:fixed;
  top:calc(28px + env(safe-area-inset-top,0px));
  right:max(28px,env(safe-area-inset-right,0px));
  background:var(--glass);border:1px solid var(--line);border-radius:99px;
  padding:9px 16px;font-family:var(--display);font-size:14px;letter-spacing:.16em;
  backdrop-filter:blur(10px)
}
#sound[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}

.foot{
  position:fixed;left:0;right:0;
  bottom:calc(26px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;text-align:center
}
#legend{
  max-width:34em;margin:0;font-style:italic;font-size:clamp(16px,1.6vw,20px);line-height:1.45;
  color:var(--bone);text-shadow:0 2px 14px #000,0 0 30px #000;
  opacity:0;transform:translateY(8px);transition:opacity 1.6s ease,transform 1.6s ease
}
#legend.on{opacity:.92;transform:none}
.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{
  pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:99px;
  padding:11px 22px;font-family:var(--display);font-size:15px;letter-spacing:.2em;
  backdrop-filter:blur(10px);transition:border-color .3s,color .3s
}
.pill:hover{border-color:var(--ember);color:var(--ember)}
.pill.gold{border-color:var(--ember);color:var(--ember)}

#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:4;
  background:radial-gradient(circle at 50% 55%,#fff8e6 0%,#ffd98f 35%,#c98236 75%,#4a2810 100%)}

#veil{position:fixed;inset:0;background:var(--night);display:grid;place-content:center;
  font-family:var(--display);letter-spacing:.4em;color:var(--ember);transition:opacity 1.2s ease;z-index:5}
#veil.gone{opacity:0;pointer-events:none}
#veil p{max-width:440px;padding:24px;line-height:1.7;letter-spacing:.05em;font-family:var(--body);color:var(--bone);text-align:center}

@media (max-width:640px){
  .title p{font-size:15px}
  #sound{padding:8px 12px;font-size:12px}
  .pill{padding:10px 16px;font-size:13px;letter-spacing:.14em}
}
@media (prefers-reduced-motion:reduce){
  #legend{transition:none}
}
</style>
</head>
<body>
<div id="stage" aria-label="Деревянный терем Китежа, стоящий в озере. Двери можно открыть и войти в город."></div>

<div class="title">
  <h1>Китеж</h1>
  <p id="subtitle">Невидимый град на озере Светлояр</p>
</div>

<button id="sound" aria-pressed="false">♫ Звон</button>

<div class="foot">
  <p id="legend">Говорят, в тихую ночь из-под воды слышен колокольный звон, а тем, кто чист сердцем, град открывает свои ворота.</p>
  <div class="buttons">
    <button id="toggle" class="pill">Открыть двери</button>
    <button id="enter" class="pill gold" hidden>Войти в град</button>
    <button id="exit" class="pill" hidden>Выйти</button>
  </div>
</div>

<div id="flash"></div>
<div id="veil">КИТЕЖ</div>

const $ = s => document.querySelector(s);
const veil = $('#veil');

function fail(msg) {
  veil.classList.remove('gone');
  veil.innerHTML = '<p></p>';
  veil.querySelector('p').textContent = msg;
}

function loadImage(src) {
  return new Promise((ok, bad) => {
    const i = new Image();
    i.onload = () => ok(i);
    i.onerror = bad;
    i.src = src;
  });
}

if (!window.THREE || !window.gsap) {
  fail('Не удалось загрузить Three.js и GSAP. Откройте страницу с доступом к интернету.');
} else {
  Promise.all([loadImage(PHOTO_GATE), loadImage(PHOTO_CITY)])
    .then(([a, b]) => {
      try { boot(a, b); } catch (e) { console.error(e); fail('Сцена не запустилась: ' + e.message + '. Нужен браузер с WebGL.'); }
    })
    .catch(() => fail('Не удалось прочитать изображения.'));
}

function boot(imgGate, imgCity) {
  // Оба фото 1024×572: 1 пиксель = 0.01 единицы сцены, центр кадра в нуле.
  const IW = 1024, IH = 572;
  const X = px => (px - IW / 2) / 100;
  const Y = py => (IH / 2 - py) / 100;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const K = reduced ? 0.35 : 1;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x060b10);
  $('#stage').appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);

  function photoTexture(img) {
    const t = new THREE.Texture(img);
    t.colorSpace = THREE.NoColorSpace;
    t.minFilter = THREE.LinearFilter;
    t.generateMipmaps = false;
    t.needsUpdate = true;
    return t;
  }

  const glsl = `
    uniform float uTime;
    const vec3 WARM = vec3(1.0, 0.68, 0.34);
    vec2 toPx(vec2 uv) { return vec2(uv.x * 1024.0, (1.0 - uv.y) * 572.0); }
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
    }
    // Мерцание тёплых светлых пикселей рядом с огнями. l = (x, y, фаза), l.z > 10 — костёр, шире и сильнее.
    float flickerK(vec2 px, vec3 l) {
      float big = step(10.0, l.z);
      float ph = mod(l.z, 10.0);
      float d = distance(px, l.xy);
      float w = exp(-d * d / mix(800.0, 2600.0, big));
      float f = sin(uTime * 7.1 + ph * 3.0) * 0.5 + sin(uTime * 13.7 + ph * 5.0) * 0.3
              + (noise(vec2(uTime * mix(5.0, 9.0, big) + ph * 10.0, ph)) - 0.5) * mix(1.0, 1.8, big);
      return w * f;
    }
    vec3 applyFlicker(vec3 c, float k) {
      float lum = dot(c, vec3(0.3, 0.59, 0.11));
      float warm = smoothstep(0.2, 0.65, lum) * clamp((c.r - c.b) * 3.0, 0.0, 1.0);
      return c * (1.0 + k * 0.28 * warm);
    }
  `;

  const passUv = `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `;

  const clock = { value: 0 };

  /* ============================== СЦЕНА 1: ВРАТА ============================== */

  const gate = (() => {
    const scene = new THREE.Scene();
    const DOOR = { l: 451, r: 579, t: 317, b: 440 };
    const WATER = 440;
    const DOOR_W = (DOOR.r - DOOR.l) / 100;
    const DOOR_H = (DOOR.b - DOOR.t) / 100;
    const LEAF_W = DOOR_W / 2;
    const DOOR_CY = Y((DOOR.t + DOOR.b) / 2);
    const DEPTH = 2.6;

    const lamps = [
      [513,237,0.1],[612,328,1.3],[418,329,2.6],[791,358,3.4],[221,363,4.7],[343,241,5.9],
      [413,544,2.6],[614,547,1.3],[413,567,2.6],[614,569,1.3]
    ].map(v => new THREE.Vector3(...v));

    const uni = {
      uMap: { value: photoTexture(imgGate) },
      uTime: clock,
      uGlow: { value: 0 },
      uLamps: { value: lamps },
      uDoor: { value: new THREE.Vector4(DOOR.l, DOOR.t, DOOR.r, DOOR.b) }
    };

    const common = glsl + `
      uniform sampler2D uMap;
      uniform float uGlow;
      uniform vec3 uLamps[10];
      vec3 flicker(vec3 c, vec2 px) {
        float k = 0.0;
        for (int i = 0; i < 10; i++) k += flickerK(px, uLamps[i]);
        return applyFlicker(c, k);
      }
    `;

    // Фасад с вырезанным проёмом, рябь воды и отсвет из дверей.
    scene.add(new THREE.Mesh(
      new THREE.PlaneGeometry(IW / 100, IH / 100),
      new THREE.ShaderMaterial({
        uniforms: uni,
        vertexShader: passUv,
        fragmentShader: common + `
          uniform vec4 uDoor;
          varying vec2 vUv;
          void main() {
            vec2 uv = vUv;
            vec2 px = toPx(uv);
            if (px.x > uDoor.x && px.x < uDoor.z && px.y > uDoor.y && px.y < uDoor.w) discard;

            float below = px.y - 440.0;
            if (below > 0.0) {
              float a = (0.6 + 1.8 * below / 132.0) * smoothstep(0.0, 6.0, below);
              uv.x += (sin(px.y * 0.55 - uTime * 1.6 + noise(px * vec2(0.02, 0.15) + uTime * 0.3) * 5.0) * 0.0011
                     + (noise(vec2(px.x * 0.01, px.y * 0.08 - uTime * 0.6)) - 0.5) * 0.0025) * a;
              uv.y += sin(px.x * 0.05 + uTime * 1.1 + px.y * 0.2) * 0.0009 * a;
            }

            vec3 c = flicker(texture2D(uMap, uv).rgb, px);

            float facade = exp(-pow(length((px - vec2(515.0, 395.0)) / vec2(115.0, 80.0)), 2.0)) * step(px.y, 440.0);
            c += WARM * facade * uGlow * (c * 1.4 + 0.03);

            if (below > 0.0) {
              float wob = (noise(vec2(px.y * 0.09 - uTime * 0.9, 1.0)) - 0.5) * 34.0 * (below / 132.0);
              float dx = (px.x - 515.0 + wob) / (60.0 + below * 0.4);
              float streak = exp(-dx * dx * 2.5) * exp(-below / 150.0);
              float br = 0.5 + 0.5 * sin(px.y * 1.1 + uTime * 2.3 + noise(px * 0.05) * 4.0);
              c += WARM * streak * br * 0.8 * uGlow;
            }
            gl_FragColor = vec4(c, 1.0);
          }
        `
      })
    ));

    // Внутри: сени из брёвен, вода на полу и сияние града в глубине.
    function backWall() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const g = c.getContext('2d');
      let q = g.createRadialGradient(256, 300, 10, 256, 300, 380);
      q.addColorStop(0, '#fff6dc');
      q.addColorStop(0.25, '#ffd58a');
      q.addColorStop(0.6, '#b9732e');
      q.addColorStop(1, '#3a1f0c');
      g.fillStyle = q;
      g.fillRect(0, 0, 512, 512);

      g.fillStyle = 'rgba(120,70,25,0.55)';
      const domes = [[70,300,26],[130,268,34],[200,240,40],[256,200,52],[318,236,40],[384,262,34],[446,298,26]];
      g.beginPath();
      g.moveTo(0, 360);
      for (const [x, y, r] of domes) {
        g.lineTo(x - r * 0.8, 360);
        g.lineTo(x - r * 0.8, y + r * 1.2);
        g.lineTo(x - r * 0.55, y + r * 1.2);
        g.bezierCurveTo(x - r * 1.05, y + r * 0.3, x - r * 0.25, y - r * 0.35, x, y - r * 1.05);
        g.bezierCurveTo(x + r * 0.25, y - r * 0.35, x + r * 1.05, y + r * 0.3, x + r * 0.55, y + r * 1.2);
        g.lineTo(x + r * 0.8, y + r * 1.2);
        g.lineTo(x + r * 0.8, 360);
      }
      g.lineTo(512, 360);
      g.lineTo(512, 512);
      g.lineTo(0, 512);
      g.fill();
      for (const [x, y, r] of domes) {
        g.fillRect(x - 1.5, y - r * 1.6, 3, r * 0.6);
        g.fillRect(x - r * 0.18, y - r * 1.42, r * 0.36, 3);
      }
      for (let i = 0; i < 60; i++) {
        const [x, y, r] = domes[i % domes.length];
        g.fillStyle = `rgba(255,236,180,${0.35 + Math.random() * 0.4})`;
        g.fillRect(x - r * 0.6 + Math.random() * r * 1.2, y + r * 1.3 + Math.random() * (360 - y - r * 1.4), 3, 5);
      }
      q = g.createLinearGradient(0, 220, 0, 512);
      q.addColorStop(0, 'rgba(255,230,170,0)');
      q.addColorStop(0.55, 'rgba(255,220,150,0.45)');
      q.addColorStop(1, 'rgba(120,70,30,0.6)');
      g.fillStyle = q;
      g.fillRect(0, 0, 512, 512);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.NoColorSpace;
      return t;
    }

    const roomW = DOOR_W + 0.12, roomH = DOOR_H + 0.08;
    const room = new THREE.Mesh(
      new THREE.BoxGeometry(roomW, roomH, DEPTH),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: { ...uni, uBack: { value: backWall() }, uSize: { value: new THREE.Vector3(roomW, roomH, DEPTH) } },
        vertexShader: `
          varying vec3 vP; varying vec3 vN;
          void main() { vP = position; vN = normal; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: common + `
          uniform sampler2D uBack;
          uniform vec3 uSize;
          varying vec3 vP; varying vec3 vN;
          void main() {
            float t = clamp((uSize.z * 0.5 - vP.z) / uSize.z, 0.0, 1.0);
            float glow = 0.25 + 0.75 * uGlow;
            vec3 c;
            if (vN.z < -0.5) {
              c = texture2D(uBack, vP.xy / uSize.xy + 0.5).rgb * glow;
            } else if (abs(vN.x) > 0.5) {
              float f = fract((vP.y + uSize.y * 0.5) / 0.115);
              float lg = smoothstep(0.0, 0.18, f) * smoothstep(1.0, 0.72, f);
              float grain = 0.8 + 0.4 * noise(vec2(vP.z * 30.0, vP.y * 9.0));
              c = vec3(0.16, 0.1, 0.055) * (0.3 + 0.7 * lg) * grain * (0.4 + 3.2 * t * t) * glow;
            } else if (vP.y > 0.0) {
              float beam = step(0.75, fract(vP.z * 3.0));
              c = vec3(0.07, 0.045, 0.025) * (1.0 - 0.5 * beam) * (0.4 + 2.5 * t * t) * glow;
            } else {
              float r = noise(vec2(vP.x * 9.0, vP.z * 16.0 + uTime * 0.8));
              c = vec3(0.012, 0.02, 0.025) + WARM * (0.1 + 0.9 * t * t) * (0.3 + 1.4 * pow(r, 3.0)) * glow;
            }
            c = mix(c, WARM * 1.05 * glow, smoothstep(0.25, 1.0, t) * 0.4);
            gl_FragColor = vec4(c, 1.0);
          }
        `
      })
    );
    room.position.set(X((DOOR.l + DOOR.r) / 2), Y(WATER) + roomH / 2, -DEPTH / 2 - 0.002);
    scene.add(room);

    // Створки: тот же фрагмент фото на петлях, плюс торец толщиной 5 см.
    function leaf(side) {
      const pivot = new THREE.Group();
      const left = side < 0;
      const px0 = left ? DOOR.l : (DOOR.l + DOOR.r) / 2;
      const px1 = left ? (DOOR.l + DOOR.r) / 2 : DOOR.r;
      pivot.position.set(X(left ? DOOR.l : DOOR.r), DOOR_CY, 0);

      const shift = left ? LEAF_W / 2 : -LEAF_W / 2;
      const leafUni = {
        ...uni,
        uRect: { value: new THREE.Vector4(px0 / IW, 1 - DOOR.b / IH, px1 / IW, 1 - DOOR.t / IH) },
        uAngle: { value: 0 },
        uFreeU: { value: left ? 1 : 0 }
      };

      const face = new THREE.Mesh(
        new THREE.PlaneGeometry(LEAF_W, DOOR_H).translate(shift, 0, 0),
        new THREE.ShaderMaterial({
          uniforms: leafUni,
          vertexShader: passUv,
          fragmentShader: common + `
            uniform vec4 uRect;
            uniform float uAngle;
            uniform float uFreeU;
            varying vec2 vUv;
            void main() {
              vec2 uv = mix(uRect.xy, uRect.zw, vUv);
              vec3 c = flicker(texture2D(uMap, uv).rgb, toPx(uv));
              float s = sin(uAngle);
              float deep = mix(1.0 - vUv.x, vUv.x, uFreeU);
              c *= 1.0 - 0.3 * s;
              c += WARM * uGlow * s * (0.25 + 0.75 * deep) * (c * 2.2 + 0.04);
              gl_FragColor = vec4(c, 1.0);
            }
          `
        })
      );

      const slab = new THREE.Mesh(
        new THREE.BoxGeometry(LEAF_W, DOOR_H, 0.05).translate(shift, 0, -0.026),
        new THREE.ShaderMaterial({
          uniforms: uni,
          vertexShader: passUv,
          fragmentShader: `
            uniform float uGlow;
            void main() { gl_FragColor = vec4(vec3(0.07, 0.045, 0.03) + vec3(0.25, 0.15, 0.07) * uGlow, 1.0); }
          `
        })
      );

      pivot.add(face, slab);
      scene.add(pivot);
      return { pivot, uAngle: leafUni.uAngle, sign: left ? 1 : -1 };
    }

    const leaves = [leaf(-1), leaf(1)];

    // Золотая пыль, которую выносит из сеней наружу.
    const SPARKS = 180;
    const seeds = new Float32Array(SPARKS * 4);
    for (let i = 0; i < seeds.length; i++) seeds[i] = Math.random();
    const sparkGeo = new THREE.BufferGeometry();
    sparkGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SPARKS * 3), 3));
    sparkGeo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));
    const sparkMat = new THREE.ShaderMaterial({
      uniforms: { ...uni, uPx: { value: 1 }, uCenter: { value: new THREE.Vector3(X(515), Y(WATER), 0) } },
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        attribute vec4 aSeed;
        uniform float uTime, uGlow, uPx;
        uniform vec3 uCenter;
        varying float vA;
        void main() {
          float life = fract(uTime * (0.05 + aSeed.w * 0.07) + aSeed.x * 7.0);
          vec3 p = uCenter;
          p.x += (aSeed.x - 0.5) * 1.1 * (1.0 + life * 1.6) + sin(uTime * 0.7 + aSeed.y * 20.0) * 0.06;
          p.y += 0.06 + aSeed.y * 1.1 + life * 0.5 + sin(uTime * 0.9 + aSeed.z * 20.0) * 0.04;
          p.z = mix(-2.3, 2.2, life) * (0.6 + aSeed.z * 0.4);
          vA = sin(life * 3.14159) * uGlow * (0.4 + 0.6 * aSeed.z);
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = (2.0 + aSeed.y * 4.0) * uPx * (8.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying float vA;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          gl_FragColor = vec4(vec3(1.0, 0.78, 0.45) * smoothstep(0.5, 0.0, d) * vA, 1.0);
        }
      `
    });
    const sparks = new THREE.Points(sparkGeo, sparkMat);
    sparks.frustumCulled = false;
    scene.add(sparks);

    // Туман над водой, тёплый у дверей, когда они открыты.
    const fog = new THREE.Mesh(
      new THREE.PlaneGeometry(IW / 100, IH / 100),
      new THREE.ShaderMaterial({
        uniforms: uni,
        transparent: true,
        depthWrite: false,
        vertexShader: passUv,
        fragmentShader: common + `
          varying vec2 vUv;
          float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }
          void main() {
            vec2 px = toPx(vUv);
            float band = exp(-pow((px.y - 425.0) / 75.0, 2.0));
            float f = fbm(px * vec2(0.006, 0.02) + vec2(uTime * 0.03, uTime * 0.004));
            float a = band * smoothstep(0.3, 0.8, f) * 0.42;
            float near = exp(-pow(length((px - vec2(515.0, 425.0)) / vec2(190.0, 70.0)), 2.0));
            vec3 col = mix(vec3(0.38, 0.44, 0.5), WARM * 1.2, uGlow * near);
            gl_FragColor = vec4(col, a * (1.0 + uGlow * near * 0.8));
          }
        `
      })
    );
    fog.position.z = 0.012;
    scene.add(fog);

    const DOOR_X = X(515);
    return {
      scene, uni, leaves, sparkMat, DOOR, DOOR_X, DOOR_CY,
      isOver: p => p && p.x > DOOR.l && p.x < DOOR.r && p.y > DOOR.t && p.y < DOOR.b
    };
  })();

  /* ============================== СЦЕНА 2: ГРАД ============================== */

  const city = (() => {
    const scene = new THREE.Scene();

    // Огни города: костры (фаза > 10) и окна с фонарями.
    const lamps = [
      [330,378,10.4],[546,359,12.1],[193,338,0.7],[195,163,1.9],[387,348,2.8],
      [853,339,3.6],[744,289,4.4],[575,346,5.2],[330,445,10.4],[546,393,12.1]
    ].map(v => new THREE.Vector3(...v));

    // Башни, в которые можно ударить, и луна.
    const BELLS = [[193,40],[312,180],[650,190],[862,72]];
    const MOON = [692, 105];
    const VP = [520, 376];

    // Две передние лодки: контур с гребцами, весло, ватерлиния и место отражения под корпусом.
    // ax — середина корпуса, лодка «смотрит» носом вправо.
    const BOATS = [
      {
        rect: [374, 360, 462, 412], yc: 406, ax: 420,
        poly: [[380,390],[392,386],[412,384],[421,378],[423,368],[428,364],[436,366],[441,378],[452,378],[459,380],[458,393],[451,404],[438,408],[410,408],[392,404],[381,398]],
        oar: [[386,371],[458,411]],
        refl: [378, 402, 462, 420]
      },
      {
        rect: [598, 356, 724, 425], yc: 419, ax: 682,
        poly: [[645,399],[652,392],[660,378],[668,371],[676,374],[677,362],[690,358],[701,362],[700,377],[707,386],[714,394],[720,402],[719,413],[706,421],[670,422],[652,416],[645,408]],
        oar: [[601,423],[692,394]],
        refl: [600, 414, 724, 434]
      }
    ];
    const HORIZON = 352;

    // Маски (R, G — лодки; B — что стереть с фона) и фото без лодок.
    // Место под лодками заполняется заливкой от краёв (push-pull), рябь шейдера прячет мягкость.
    function prepareBoats() {
      const w = IW, h = IH;
      const mk = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
      const drawBoat = (g, b, grow) => {
        g.beginPath();
        b.poly.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
        g.closePath();
        g.fill();
        g.lineJoin = g.lineCap = 'round';
        if (grow) { g.lineWidth = grow; g.stroke(); }
        g.lineWidth = 3 + grow;
        g.beginPath();
        g.moveTo(...b.oar[0]);
        g.lineTo(...b.oar[1]);
        g.stroke();
      };
      const maskOf = (draw, blur) => {
        const c = mk(), g = c.getContext('2d');
        g.fillStyle = g.strokeStyle = '#fff';
        draw(g);
        const o = mk(), og = o.getContext('2d');
        og.filter = `blur(${blur}px)`;
        og.drawImage(c, 0, 0);
        return og.getImageData(0, 0, w, h).data;
      };
      const mA = maskOf(g => drawBoat(g, BOATS[0], 0), 0.6);
      const mB = maskOf(g => drawBoat(g, BOATS[1], 0), 0.6);
      const mC = maskOf(g => BOATS.forEach(b => {
        drawBoat(g, b, 7);
        g.fillRect(b.refl[0], b.refl[1], b.refl[2] - b.refl[0], b.refl[3] - b.refl[1]);
      }), 2);

      const maskCanvas = mk();
      const mg = maskCanvas.getContext('2d');
      const md = mg.createImageData(w, h);
      for (let i = 0; i < w * h * 4; i += 4) {
        md.data[i] = mA[i + 3];
        md.data[i + 1] = mB[i + 3];
        md.data[i + 2] = mC[i + 3];
        md.data[i + 3] = 255;
      }
      mg.putImageData(md, 0, 0);

      const photo = mk();
      const pg = photo.getContext('2d');
      pg.drawImage(imgCity, 0, 0);
      const img = pg.getImageData(0, 0, w, h);

      // Push-pull: уменьшаем известные пиксели пирамидой, затем заполняем дыры сверху вниз.
      let L = { w, h, c: new Float32Array(w * h * 3), k: new Float32Array(w * h) };
      for (let i = 0; i < w * h; i++) {
        const k = 1 - mC[i * 4 + 3] / 255;
        L.k[i] = k;
        for (let ch = 0; ch < 3; ch++) L.c[i * 3 + ch] = img.data[i * 4 + ch] * k;
      }
      const levels = [L];
      while (L.w > 2 && L.h > 2) {
        const nw = Math.ceil(L.w / 2), nh = Math.ceil(L.h / 2);
        const N = { w: nw, h: nh, c: new Float32Array(nw * nh * 3), k: new Float32Array(nw * nh) };
        for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
          const i = y * L.w + x, j = (y >> 1) * nw + (x >> 1);
          N.k[j] += L.k[i];
          for (let ch = 0; ch < 3; ch++) N.c[j * 3 + ch] += L.c[i * 3 + ch];
        }
        for (let j = 0; j < nw * nh; j++) {
          const k = N.k[j];
          if (k > 1) { for (let ch = 0; ch < 3; ch++) N.c[j * 3 + ch] /= k; N.k[j] = 1; }
        }
        levels.push(N);
        L = N;
      }
      for (let j = 0; j < L.w * L.h; j++) {
        const k = L.k[j];
        if (k > 0 && k < 1) { for (let ch = 0; ch < 3; ch++) L.c[j * 3 + ch] /= k; L.k[j] = 1; }
      }
      for (let l = levels.length - 2; l >= 0; l--) {
        const A = levels[l], U = levels[l + 1];
        for (let y = 0; y < A.h; y++) for (let x = 0; x < A.w; x++) {
          const i = y * A.w + x;
          const k = Math.min(1, A.k[i]);
          if (k >= 1) continue;
          const ux = Math.min(U.w - 1, Math.max(0, (x + 0.5) / 2 - 0.5));
          const uy = Math.min(U.h - 1, Math.max(0, (y + 0.5) / 2 - 0.5));
          const x0 = Math.floor(ux), y0 = Math.floor(uy);
          const x1 = Math.min(U.w - 1, x0 + 1), y1 = Math.min(U.h - 1, y0 + 1);
          const fx = ux - x0, fy = uy - y0;
          for (let ch = 0; ch < 3; ch++) {
            const v = (U.c[(y0 * U.w + x0) * 3 + ch] * (1 - fx) + U.c[(y0 * U.w + x1) * 3 + ch] * fx) * (1 - fy)
                    + (U.c[(y1 * U.w + x0) * 3 + ch] * (1 - fx) + U.c[(y1 * U.w + x1) * 3 + ch] * fx) * fy;
            A.c[i * 3 + ch] += (1 - k) * v;
          }
          A.k[i] = 1;
        }
      }
      const base = levels[0];
      for (let i = 0; i < w * h; i++) for (let ch = 0; ch < 3; ch++) img.data[i * 4 + ch] = base.c[i * 3 + ch];
      pg.putImageData(img, 0, 0);

      const tex = c => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace; t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; return t; };
      return { clean: tex(photo), mask: tex(maskCanvas) };
    }
    const boatPrep = prepareBoats();

    const ripples = Array.from({ length: 10 }, () => new THREE.Vector3(0, 0, -99));
    const bells = BELLS.map(([x, y]) => new THREE.Vector3(x, y, -99));

    const uni = {
      uMap: { value: boatPrep.clean },
      uOrig: { value: photoTexture(imgCity) },
      uBoatMask: { value: boatPrep.mask },
      uBoats: { value: [new THREE.Vector4(), new THREE.Vector4()] },
      uTime: clock,
      uLamps: { value: lamps },
      uRip: { value: ripples },
      uBell: { value: bells },
      uMoon: { value: 0 },
      uCamRef: { value: new THREE.Vector3(0, 0, 10) }
    };

    // Глубина кадра по пикселю фото: створки и порог близко, вода к нам, небо и даль далеко.
    const depthGlsl = `
      uniform vec3 uCamRef;
      float depthAt(vec2 px) {
        float side = max(smoothstep(330.0, 150.0, px.x), smoothstep(720.0, 880.0, px.x));
        float near = smoothstep(380.0, 525.0, px.y);
        float sky = smoothstep(300.0, 220.0, px.y) * (1.0 - side);
        return mix(-1.3, 0.0, max(side * 0.85, near)) - 0.5 * sky;
      }
      // Сдвиг вдоль луча исходной камеры: в покое кадр совпадает с фото, при движении появляется параллакс.
      vec3 place(vec3 p, float d) { return p + normalize(p - uCamRef) * (-d); }
    `;
    function depthAt(px, py) {
      const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
      const side = Math.max(ss(330, 150, px), ss(720, 880, px));
      const near = ss(380, 525, py);
      const sky = ss(300, 220, py) * (1 - side);
      return -1.3 + 1.3 * Math.max(side * 0.85, near) - 0.5 * sky;
    }
    const FG_DEPTH = 0.45;

    const common = glsl + depthGlsl + `
      uniform sampler2D uMap;
      uniform vec3 uLamps[10];
      uniform vec3 uRip[10];
      uniform vec4 uBoats[2];
      uniform vec3 uBell[4];
      uniform float uMoon;
    `;

    // Задний план: город и вода. Под створками, цепями и порогом подставлены соседние пиксели,
    // чтобы при параллаксе из-за переднего плана не выглядывали их копии.
    const bgGeo = new THREE.PlaneGeometry(IW / 100, IH / 100, 200, 112);
    const bg = new THREE.Mesh(bgGeo, new THREE.ShaderMaterial({
      uniforms: uni,
      vertexShader: depthGlsl + `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          vec2 px = vec2(uv.x * 1024.0, (1.0 - uv.y) * 572.0);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(place(position, depthAt(px)), 1.0);
        }
      `,
      fragmentShader: common + `
        varying vec2 vUv;
        float segDist(vec2 p, vec2 a, vec2 b, out vec2 n) {
          vec2 ab = b - a;
          float t = clamp(dot(p - a, ab) / dot(ab, ab), 0.0, 1.0);
          vec2 q = a + ab * t;
          n = normalize(vec2(-ab.y, ab.x));
          return distance(p, q);
        }
        vec2 hideChain(vec2 px, vec2 a, vec2 b, vec2 c) {
          vec2 n1, n2;
          float d1 = segDist(px, a, b, n1);
          float d2 = segDist(px, b, c, n2);
          vec2 n = d1 < d2 ? n1 : n2;
          float d = min(d1, d2);
          if (d < 11.0) {
            float s = sign(dot(px - b, n) + 0.001);
            px += n * s * (22.0 - d);
          }
          return px;
        }
        void main() {
          vec2 px = toPx(vUv);
          vec2 sp = px;
          float leftEdge = mix(142.0, 130.0, clamp(px.y / 520.0, 0.0, 1.0));
          float rightEdge = mix(892.0, 906.0, clamp((px.y - 300.0) / 220.0, 0.0, 1.0));
          if (sp.x < leftEdge + 3.0) sp.x = leftEdge + 4.0 + (leftEdge - sp.x) * 0.15;
          if (sp.x > rightEdge - 3.0) sp.x = rightEdge - 4.0 - (sp.x - rightEdge) * 0.15;
          if (sp.y > 525.0) sp.y = 521.0 - (sp.y - 525.0) * 0.3;
          if (sp.y < 16.0) sp.y = 20.0 + (16.0 - sp.y) * 0.3;
          sp = hideChain(sp, vec2(139.0, 288.0), vec2(192.0, 420.0), vec2(232.0, 492.0));
          sp = hideChain(sp, vec2(886.0, 278.0), vec2(840.0, 405.0), vec2(798.0, 496.0));

          // Вода: рябь сильнее у зрителя, слабее у моста.
          float water = smoothstep(378.0, 405.0, px.y) * step(px.x, 900.0) * step(140.0, px.x);
          float depthW = smoothstep(380.0, 525.0, px.y);
          vec2 off = vec2(0.0);
          off.x += (sin(px.y * 0.5 - uTime * 1.4 + noise(px * vec2(0.02, 0.12) + uTime * 0.3) * 5.0) * 1.0
                  + (noise(vec2(px.x * 0.012, px.y * 0.07 - uTime * 0.5)) - 0.5) * 2.4) * (0.4 + 2.2 * depthW);
          off.y += sin(px.x * 0.04 + uTime * 1.0 + px.y * 0.18) * 0.8 * (0.4 + 1.4 * depthW);

          // Круги от касаний: эллипсы, сплюснутые перспективой.
          float ringLight = 0.0;
          for (int i = 0; i < 10; i++) {
            vec3 r = uRip[i];
            float age = uTime - r.z;
            if (age < 0.0 || age > 5.0) continue;
            float persp = 0.35 + 0.9 * smoothstep(380.0, 525.0, r.y);
            vec2 dv = (px - r.xy) / vec2(1.0, 0.32);
            float d = length(dv);
            float rad = age * 55.0 * persp;
            float ring = exp(-pow((d - rad) / (7.0 * persp), 2.0)) * exp(-age * 0.9);
            off += normalize(dv + 0.001) * ring * 5.0 * persp;
            ringLight += ring;
          }
          sp += off * water;

          // Кильватерный след: два расходящихся «уса» за кормой идущей лодки.
          float wakeLight = 0.0;
          for (int i = 0; i < 2; i++) {
            vec4 b = uBoats[i];
            float spd = length(b.zw);
            if (spd < 0.5) continue;
            float persp = clamp((b.y - 352.0) / 60.0, 0.15, 1.6);
            vec2 dir = normalize(vec2(b.z, b.w / 0.32));
            vec2 rel = vec2(px.x - b.x, (px.y - b.y) / 0.32) / persp;
            float along = -dot(rel, dir);
            if (along <= 0.0) continue;
            float lat = abs(dir.x * rel.y - dir.y * rel.x);
            float arm = exp(-pow((lat - along * 0.36) / (3.0 + along * 0.08), 2.0));
            float fade = exp(-along / 90.0) * smoothstep(0.0, 10.0, along) * min(1.0, spd / 8.0);
            float wv = arm * fade * (0.6 + 0.4 * sin(along * 0.5 - uTime * 6.0));
            sp.y += wv * 1.6 * persp * water;
            wakeLight += wv;
          }

          vec3 c = texture2D(uMap, vec2(sp.x / 1024.0, 1.0 - sp.y / 572.0)).rgb;

          float k = 0.0;
          for (int i = 0; i < 10; i++) k += flickerK(px, uLamps[i]);
          c = applyFlicker(c, k);

          // Звёзды мерцают: только одиночные точки ярче своего окружения, не облака у луны.
          float lum = dot(c, vec3(0.3, 0.59, 0.11));
          vec2 suv = vec2(sp.x / 1024.0, 1.0 - sp.y / 572.0);
          vec2 o = vec2(4.0 / 1024.0, 4.0 / 572.0);
          vec3 around = (texture2D(uMap, suv + vec2(o.x, 0.0)).rgb + texture2D(uMap, suv - vec2(o.x, 0.0)).rgb
                       + texture2D(uMap, suv + vec2(0.0, o.y)).rgb + texture2D(uMap, suv - vec2(0.0, o.y)).rgb) * 0.25;
          float star = smoothstep(0.08, 0.2, lum - dot(around, vec3(0.3, 0.59, 0.11)));
          float sky = smoothstep(260.0, 200.0, px.y);
          c *= 1.0 + sky * star * (noise(vec2(floor(px.x / 3.0) * 7.1 + floor(px.y / 3.0) * 3.3, uTime * 2.5)) - 0.45) * 1.4;

          // Колокола: вспышка у шпиля, золотая волна и отклик окон.
          float flash = 0.0;
          for (int i = 0; i < 4; i++) {
            vec3 b = uBell[i];
            float age = uTime - b.z;
            if (age < 0.0 || age > 6.0) continue;
            float d = distance(px, b.xy);
            float halo = exp(-d * d / (2.0 * pow(26.0 + age * 30.0, 2.0))) * exp(-age * 1.4);
            float wave = exp(-pow((d - age * 260.0) / 16.0, 2.0)) * exp(-age * 0.9);
            c += vec3(1.0, 0.8, 0.45) * (halo * 0.9 + wave * 0.18);
            flash += exp(-age * 0.8);
          }
          float warm = smoothstep(0.25, 0.6, lum) * clamp((c.r - c.b) * 3.0, 0.0, 1.0);
          c *= 1.0 + warm * min(flash, 1.5) * 0.45;

          // Луна и лунная дорожка.
          float md = distance(px, vec2(${MOON[0]}.0, ${MOON[1]}.0));
          c += vec3(0.55, 0.65, 0.8) * exp(-md * md / 7200.0) * 0.3 * uMoon;
          float below = px.y - 385.0;
          if (below > 0.0) {
            float wob = (noise(vec2(px.y * 0.08 - uTime * 0.7, 3.0)) - 0.5) * 30.0 * (below / 140.0);
            float dx = (px.x - ${MOON[0]}.0 + wob) / (16.0 + below * 0.6);
            float path = exp(-dx * dx * 2.0) * smoothstep(0.0, 20.0, below);
            float br = 0.45 + 0.55 * sin(px.y * 1.3 + uTime * 2.0 + noise(px * 0.06) * 5.0);
            c += vec3(0.62, 0.72, 0.88) * path * br * 0.95 * uMoon * water;
          }

          c += vec3(0.6, 0.65, 0.7) * (ringLight * 0.06 + wakeLight * 0.1) * water;

          // Туман над дальней водой.
          float mist = exp(-pow((px.y - 360.0) / 32.0, 2.0)) * exp(-pow((px.x - 560.0) / 260.0, 2.0));
          float f = noise(px * vec2(0.01, 0.04) + vec2(uTime * 0.05, 0.0));
          c = mix(c, vec3(0.36, 0.42, 0.48), mist * smoothstep(0.25, 0.85, f) * 0.45);

          gl_FragColor = vec4(c, 1.0);
        }
      `
    }));
    scene.add(bg);

    // Передний план: створки, цепи и порог, вырезанные маской.
    function fgMask() {
      const c = document.createElement('canvas');
      c.width = IW;
      c.height = IH;
      const g = c.getContext('2d');
      g.fillStyle = '#fff';
      g.strokeStyle = '#fff';
      const poly = pts => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fill(); };
      poly([[0,0],[150,0],[142,30],[137,300],[130,520],[130,572],[0,572]]);
      poly([[1024,0],[880,0],[893,35],[890,300],[905,520],[905,572],[1024,572]]);
      g.fillRect(0, 0, IW, 15);
      g.fillRect(0, 527, IW, IH - 527);
      g.lineWidth = 15;
      g.lineCap = 'round';
      g.lineJoin = 'round';
      for (const chain of [[[139,288],[192,420],[232,492]], [[886,278],[840,405],[798,496]]]) {
        g.beginPath();
        chain.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
        g.stroke();
      }
      // Мягкий край, чтобы шов не читался.
      const soft = document.createElement('canvas');
      soft.width = IW;
      soft.height = IH;
      const s = soft.getContext('2d');
      s.filter = 'blur(1.5px)';
      s.drawImage(c, 0, 0);
      const t = new THREE.CanvasTexture(soft);
      t.colorSpace = THREE.NoColorSpace;
      return t;
    }

    const fg = new THREE.Mesh(
      new THREE.PlaneGeometry(IW / 100, IH / 100, 1, 1),
      new THREE.ShaderMaterial({
        uniforms: { ...uni, uMask: { value: fgMask() }, uDepth: { value: FG_DEPTH } },
        transparent: true,
        depthWrite: false,
        vertexShader: depthGlsl + `
          uniform float uDepth;
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(place(position, uDepth), 1.0); }
        `,
        fragmentShader: common + `
          uniform sampler2D uMask;
          varying vec2 vUv;
          void main() {
            float a = texture2D(uMask, vUv).r;
            if (a < 0.01) discard;
            vec2 px = toPx(vUv);
            vec3 c = texture2D(uMap, vUv).rgb;
            float k = 0.0;
            for (int i = 0; i < 10; i++) k += flickerK(px, uLamps[i]);
            c = applyFlicker(c, k);
            gl_FragColor = vec4(c, a);
          }
        `
      })
    );
    fg.renderOrder = 3;
    scene.add(fg);

    // Перевод точки на фото в мир с той же глубиной, что у заднего плана.
    const camRef = uni.uCamRef.value;
    const dir = new THREE.Vector3();
    function placePx(px, py, out) {
      out.set(X(px), Y(py), 0);
      dir.copy(out).sub(camRef).normalize();
      return out.addScaledVector(dir, -depthAt(px, py));
    }

    // Искры над кострами.
    const EMBERS = 110;
    const eSeeds = new Float32Array(EMBERS * 4);
    for (let i = 0; i < EMBERS; i++) {
      eSeeds.set([Math.random(), Math.random(), i % 3 === 0 ? 1 : 0, Math.random()], i * 4);
    }
    const eGeo = new THREE.BufferGeometry();
    eGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(EMBERS * 3), 3));
    eGeo.setAttribute('aSeed', new THREE.BufferAttribute(eSeeds, 4));
    const emberMat = new THREE.ShaderMaterial({
      uniforms: { ...uni, uPx: { value: 1 } },
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending,
      vertexShader: depthGlsl + `
        attribute vec4 aSeed;
        uniform float uTime, uPx;
        varying float vA;
        void main() {
          float life = fract(uTime * (0.25 + aSeed.w * 0.3) + aSeed.x * 5.0);
          vec2 fire = aSeed.z > 0.5 ? vec2(546.0, 356.0) : vec2(330.0, 374.0);
          float scale = aSeed.z > 0.5 ? 0.6 : 1.0;
          vec2 px = fire + vec2((aSeed.y - 0.5) * 10.0 + sin(uTime * 2.0 + aSeed.x * 30.0) * 6.0 * life,
                                -life * 85.0 * scale);
          vec3 base = vec3((px.x - 512.0) / 100.0, (286.0 - px.y) / 100.0, 0.0);
          vec4 mv = modelViewMatrix * vec4(place(base, depthAt(fire)), 1.0);
          vA = (1.0 - life) * smoothstep(0.0, 0.1, life);
          gl_PointSize = (1.5 + aSeed.y * 2.5) * uPx * scale * (9.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying float vA;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          gl_FragColor = vec4(vec3(1.0, 0.62, 0.25) * smoothstep(0.5, 0.0, d) * vA, 1.0);
        }
      `
    });
    const embers = new THREE.Points(eGeo, emberMat);
    embers.frustumCulled = false;
    embers.renderOrder = 1;
    scene.add(embers);

    // Огоньки на воде: свеча в плошке и её отражение в одном квадрате.
    const MAX_LIGHTS = 16;
    const lightGeo = new THREE.PlaneGeometry(1, 2).translate(0, -0.5, 0);
    const lightPhase = new Float32Array(MAX_LIGHTS);
    const lightAlpha = new Float32Array(MAX_LIGHTS);
    lightGeo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(lightPhase, 1));
    lightGeo.setAttribute('aAlpha', new THREE.InstancedBufferAttribute(lightAlpha, 1));
    const lightMat = new THREE.ShaderMaterial({
      uniforms: { uTime: clock },
      transparent: true,
      depthWrite: false,
      depthTest: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        attribute float aPhase;
        attribute float aAlpha;
        varying vec2 vUv;
        varying float vPhase;
        varying float vAlpha;
        void main() {
          vUv = uv; vPhase = aPhase; vAlpha = aAlpha;
          gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;
        varying float vPhase;
        varying float vAlpha;
        void main() {
          // Верхняя половина — огонёк, нижняя — дрожащее отражение.
          vec2 p = vec2(vUv.x - 0.5, vUv.y * 2.0 - 1.0);
          float fl = 0.85 + 0.15 * sin(uTime * 9.0 + vPhase * 20.0) + 0.1 * sin(uTime * 23.0 + vPhase * 7.0);
          float flame = exp(-(p.x * p.x * 90.0 + pow(p.y - 0.55, 2.0) * 30.0)) * fl;
          float glow = exp(-(p.x * p.x + pow(p.y - 0.45, 2.0)) * 9.0) * 0.45 * fl;
          float bowl = exp(-(p.x * p.x * 22.0 + pow(p.y - 0.18, 2.0) * 260.0)) * 0.35;
          float refl = 0.0;
          if (p.y < 0.05) {
            float wx = p.x + sin(p.y * 40.0 + uTime * 3.0 + vPhase * 10.0) * 0.04;
            refl = exp(-wx * wx * 60.0) * smoothstep(-1.0, 0.0, p.y) * (0.5 + 0.5 * sin(p.y * 60.0 + uTime * 4.0)) * 0.5 * fl;
          }
          vec3 col = vec3(1.0, 0.85, 0.55) * flame * 1.6 + vec3(1.0, 0.6, 0.25) * (glow + refl) + vec3(0.6, 0.35, 0.15) * bowl;
          gl_FragColor = vec4(col * vAlpha, 1.0);
        }
      `
    });
    const lightMesh = new THREE.InstancedMesh(lightGeo, lightMat, MAX_LIGHTS);
    lightMesh.frustumCulled = false;
    lightMesh.renderOrder = 2;
    lightMesh.count = 0;
    scene.add(lightMesh);

    const lights = [];
    const m4 = new THREE.Matrix4();
    const pos = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const scl = new THREE.Vector3();

    function launch(px, py) {
      if (lights.length >= MAX_LIGHTS) lights.shift();
      lights.push({
        x0: px, y0: py,
        tx: VP[0] + (Math.random() - 0.5) * 60, ty: VP[1] + Math.random() * 6,
        born: clock.value, life: 34 + Math.random() * 16, phase: Math.random(),
        drift: (Math.random() - 0.5) * 2
      });
    }

    function updateLights() {
      const now = clock.value;
      for (let i = lights.length - 1; i >= 0; i--) if (now - lights[i].born > lights[i].life) lights.splice(i, 1);
      lights.forEach((l, i) => {
        const u = (now - l.born) / l.life;
        const e = 1 - Math.pow(1 - u, 1.6);
        const px = l.x0 + (l.tx - l.x0) * e + Math.sin(now * 0.4 + l.phase * 9) * 6 * (1 - u) * l.drift;
        const py = l.y0 + (l.ty - l.y0) * e + Math.sin(now * 1.3 + l.phase * 5) * 0.8;
        const persp = 0.25 + 0.75 * Math.min(1, Math.max(0, (py - 370) / 150));
        placePx(px, py, pos);
        scl.set(0.34 * persp, 0.34 * persp, 1);
        m4.compose(pos, quat, scl);
        lightMesh.setMatrixAt(i, m4);
        lightPhase[i] = l.phase;
        lightAlpha[i] = Math.min(1, (now - l.born) * 2) * (1 - Math.pow(u, 3));
      });
      lightMesh.count = lights.length;
      lightMesh.instanceMatrix.needsUpdate = true;
      lightGeo.attributes.aPhase.needsUpdate = true;
      lightGeo.attributes.aAlpha.needsUpdate = true;
    }

    let ripIndex = 0;
    function ripple(px, py) {
      ripples[ripIndex].set(px, py, clock.value);
      ripIndex = (ripIndex + 1) % ripples.length;
    }

    // ЛОДКИ: вырезанные из фото, с отражением, которое рисуется в том же квадрате ниже ватерлинии.
    const boats = BOATS.map((b, i) => {
      const topH = b.yc - b.rect[1];
      const refH = Math.round(topH * 0.9);
      const wpx = b.rect[2] - b.rect[0];
      const geo = new THREE.PlaneGeometry(wpx / 100, (topH + refH) / 100)
        .translate(((b.rect[0] + b.rect[2]) / 2 - b.ax) / 100, (topH - refH) / 200, 0);
      const bu = {
        uTime: clock,
        uOrig: uni.uOrig,
        uMask: uni.uBoatMask,
        uRect: { value: new THREE.Vector4(...b.rect) },
        uYc: { value: b.yc },
        uRefH: { value: refH },
        uChan: { value: i },
        uSel: { value: 0 },
        uFog: { value: 0 },
        uAlpha: { value: 1 }
      };
      const mat = new THREE.ShaderMaterial({
        uniforms: bu,
        transparent: true,
        depthWrite: false,
        depthTest: false,
        vertexShader: passUv,
        fragmentShader: `
          uniform sampler2D uOrig, uMask;
          uniform vec4 uRect;
          uniform float uTime, uYc, uRefH, uChan, uSel, uFog, uAlpha;
          varying vec2 vUv;
          vec2 tuv(vec2 p) { return vec2(p.x / 1024.0, 1.0 - p.y / 572.0); }
          float maskAt(vec2 p) {
            if (p.x < uRect.x || p.x > uRect.z || p.y < uRect.y) return 0.0;
            vec4 m = texture2D(uMask, tuv(p));
            return uChan < 0.5 ? m.r : m.g;
          }
          void main() {
            vec2 p = vec2(mix(uRect.x, uRect.z, vUv.x), mix(uYc + uRefH, uRect.y, vUv.y));
            vec3 c;
            float a;
            if (p.y <= uYc + 1.0) {
              a = maskAt(p);
              c = texture2D(uOrig, tuv(p)).rgb;
              // Выбранная лодка обведена тёплым светом.
              float near = max(max(maskAt(p + vec2(3.0, 0.0)), maskAt(p - vec2(3.0, 0.0))),
                               max(maskAt(p + vec2(0.0, 3.0)), maskAt(p - vec2(0.0, 3.0))));
              float rim = clamp(near - a, 0.0, 1.0) * uSel * (0.75 + 0.25 * sin(uTime * 4.0));
              c = mix(vec3(1.0, 0.8, 0.45), c, a / max(a + rim, 0.001));
              a = max(a, rim);
            } else {
              float d = p.y - uYc;
              float t = d / uRefH;
              vec2 q = vec2(p.x + sin(p.y * 0.7 + uTime * 3.0) * 1.3 * (t + 0.2), uYc - d * 1.05);
              a = maskAt(q) * 0.38 * (1.0 - t);
              c = texture2D(uOrig, tuv(q)).rgb * vec3(0.7, 0.8, 0.9);
            }
            c = mix(c, vec3(0.36, 0.42, 0.48), uFog);
            gl_FragColor = vec4(c, a * uAlpha);
          }
        `
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.frustumCulled = false;
      scene.add(mesh);
      return {
        def: b, mesh, u: bu, topH, wpx, i,
        x: b.ax, y: b.yc, home: [b.ax, b.yc],
        target: null, face: 1, faceV: 1, vx: 0, vy: 0, idle: 6 * i, phase: i * 1.7, lastStroke: 0
      };
    });

    const persp = (b, y) => Math.min(1.6, Math.max(0.12, (y - HORIZON) / (b.def.yc - HORIZON)));
    let selected = -1;

    function boatAt(p) {
      if (!p) return -1;
      for (let k = boats.length - 1; k >= 0; k--) {
        const b = boats[k];
        const s = persp(b, b.y);
        const half = b.wpx * 0.5 * s;
        if (Math.abs(p.x - b.x) < half && p.y < b.y + 6 * s && p.y > b.y - b.topH * s) return k;
      }
      return -1;
    }

    function select(k) {
      selected = selected === k ? -1 : k;
      boats.forEach((b, j) => gsap.to(b.u.uSel, { value: j === selected ? 1 : 0, duration: 0.4 }));
      return selected;
    }

    function sendBoat(px, py) {
      if (selected < 0) return false;
      const b = boats[selected];
      b.target = [px, py];
      b.idle = 0;
      select(selected);
      return true;
    }

    function randomWater() {
      for (let n = 0; n < 40; n++) {
        const p = { x: 240 + Math.random() * 560, y: 388 + Math.random() * 120 };
        if (isWater(p)) return [p.x, p.y];
      }
      return [520, 440];
    }

    let onStroke = () => {};
    const bpos = new THREE.Vector3();
    function updateBoats(dt) {
      const t = clock.value;
      boats.forEach(b => {
        const s = persp(b, b.y);
        let moving = false;
        if (b.target) {
          // Расстояние считаем «по воде»: вертикаль на фото сжата перспективой.
          const dx = b.target[0] - b.x;
          const dy = (b.target[1] - b.y) / 0.32;
          const dist = Math.hypot(dx, dy) / s;
          if (dist < 4) {
            b.target = null;
            ripple(b.x, b.y);
          } else {
            moving = true;
            // Рывок на каждый гребок, затем накат.
            const stroke = Math.sin(t * 2.4 + b.phase);
            const v = (10 + 26 * Math.pow(Math.max(0, stroke), 2)) * s;
            const step = Math.min(v * dt, dist * s);
            const gx = dx / Math.hypot(dx, dy), gy = dy / Math.hypot(dx, dy);
            b.vx = gx * v;
            b.vy = gy * v * 0.32;
            b.x += gx * step;
            b.y += gy * step * 0.32;
            if (Math.abs(gx) > 0.3) b.face = Math.sign(gx);
            if (stroke > 0.95 && t - b.lastStroke > 1) {
              b.lastStroke = t;
              ripple(b.x - b.face * b.wpx * 0.25 * s, b.y + 1);
              onStroke(s);
            }
          }
        }
        if (!moving) {
          b.vx *= Math.exp(-dt * 2);
          b.vy *= Math.exp(-dt * 2);
          if (selected !== b.i) b.idle += dt;
          // Без участия зрителя лодки иногда сами отправляются в путь или возвращаются к причалу.
          if (b.idle > 22 + b.i * 9) {
            b.idle = 0;
            const far = Math.hypot(b.x - b.home[0], b.y - b.home[1]) > 20;
            b.target = far && Math.random() < 0.5 ? b.home.slice() : randomWater();
          }
        }
        b.faceV += (b.face - b.faceV) * (1 - Math.exp(-dt * 1.6));

        const bob = Math.sin(t * 1.3 + b.phase * 2) * 0.9 * s;
        const d = depthAt(b.x, b.y + bob);
        placePx(b.x, b.y + bob, bpos);
        const L = Math.hypot(X(b.x) - camRef.x, Y(b.y) - camRef.y, camRef.z);
        const k = s * (L - d) / L;
        b.mesh.position.copy(bpos);
        b.mesh.scale.set(k * b.faceV, k, 1);
        b.mesh.rotation.z = Math.sin(t * 1.1 + b.phase) * 0.018 + (moving ? -b.face * 0.01 : 0);
        b.mesh.renderOrder = 2.1 + b.y / 10000;
        b.u.uFog.value = Math.min(0.6, Math.max(0, (398 - b.y) / 26) * 0.6);
        b.u.uAlpha.value = Math.min(1, Math.max(0, (b.y - 364) / 12));
        uni.uBoats.value[b.i].set(b.x, b.y, b.vx, b.vy);
      });
    }

    const isWater = p => p && p.x > 150 && p.x < 880 && p.y < 522 &&
      (p.y > 418 || (p.y > 386 && p.x > 462 && p.x < 640));
    const bellAt = p => p ? BELLS.findIndex(([x, y]) => Math.hypot(p.x - x, p.y - y) < 48) : -1;
    const isMoon = p => p && Math.hypot(p.x - MOON[0], p.y - MOON[1]) < 45;

    return {
      scene, uni, emberMat, launch, ripple, updateLights, isWater, bellAt, isMoon,
      boatAt, select, sendBoat, updateBoats,
      hasSelection: () => selected >= 0,
      set onStroke(f) { onStroke = f; },
      ringBell: i => bells[i].setZ(clock.value),
      lightCount: () => lights.length
    };
  })();

  /* ============================== ЗВУК ============================== */

  let ac = null, out = null, muffle = null, soundOn = false, bellTimer = 0, crackleTimer = 0;

  function initAudio() {
    if (ac) return;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    out = ac.createGain();
    out.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor();
    out.connect(comp);
    comp.connect(ac.destination);

    muffle = ac.createBiquadFilter();
    muffle.type = 'lowpass';
    muffle.frequency.value = 520;
    muffle.connect(out);

    const len = ac.sampleRate * 4;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.2; }
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 380;
    const wg = ac.createGain();
    wg.gain.value = 0.22;
    const lfo = ac.createOscillator();
    const lfoGain = ac.createGain();
    lfo.frequency.value = 0.13;
    lfoGain.gain.value = 0.08;
    lfo.connect(lfoGain);
    lfoGain.connect(wg.gain);
    src.connect(lp);
    lp.connect(wg);
    wg.connect(out);
    src.start();
    lfo.start();
  }

  // Колокол: неровный ряд обертонов, как у литой бронзы.
  const PARTIALS = [[0.5,0.5,9],[1,1,6],[1.19,0.55,4],[1.5,0.35,3.2],[2,0.4,2.6],[2.51,0.2,1.8],[2.66,0.18,1.5],[3.01,0.12,1.2],[4.1,0.08,0.8]];
  const BELL_NOTES = [98, 110, 130.8, 146.8, 196];

  function bell(freq, vol, when = 0) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime + when;
    const pan = ac.createStereoPanner();
    pan.pan.value = (Math.random() - 0.5) * 0.8;
    pan.connect(muffle);
    for (const [ratio, amp, decay] of PARTIALS) {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.frequency.value = freq * ratio * (1 + (Math.random() - 0.5) * 0.004);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp * vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      o.connect(g);
      g.connect(pan);
      o.start(t);
      o.stop(t + decay + 0.05);
      o.onended = () => { o.disconnect(); g.disconnect(); };
    }
  }

  function peal(n, gap) {
    for (let i = 0; i < n; i++) bell(BELL_NOTES[(n - i + 2) % BELL_NOTES.length] * 2, 0.11, i * gap);
  }

  function noiseBurst(dur, freq, q, vol, when = 0) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime + when;
    const n = Math.floor(ac.sampleRate * dur);
    const b = ac.createBuffer(1, n, ac.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
    const s = ac.createBufferSource();
    s.buffer = b;
    const f = ac.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q;
    const g = ac.createGain();
    g.gain.value = vol;
    s.connect(f);
    f.connect(g);
    g.connect(out);
    s.start(t);
    s.onended = () => { s.disconnect(); f.disconnect(); g.disconnect(); };
  }

  city.onStroke = s => noiseBurst(0.22, 650, 0.9, 0.05 + 0.05 * s);

  function plop() {
    if (!ac || !soundOn) return;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.frequency.setValueAtTime(720, t);
    o.frequency.exponentialRampToValueAtTime(170, t + 0.16);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    o.connect(g);
    g.connect(out);
    o.start(t);
    o.stop(t + 0.3);
    o.onended = () => { o.disconnect(); g.disconnect(); };
    noiseBurst(0.25, 1400, 1.2, 0.08, 0.02);
  }

  function creak(duration) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(62, t);
    for (let i = 1; i < 14; i++) o.frequency.linearRampToValueAtTime(55 + Math.random() * 60, t + duration * i / 14);
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 820;
    bp.Q.value = 6;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.15);
    g.gain.linearRampToValueAtTime(0.06, t + duration * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    o.connect(bp);
    bp.connect(g);
    g.connect(out);
    o.start(t);
    o.stop(t + duration + 0.05);
    o.onended = () => { o.disconnect(); bp.disconnect(); g.disconnect(); };
  }

  function setMuffle(hz, delay = 0) {
    if (muffle) muffle.frequency.setTargetAtTime(hz, ac.currentTime + delay, 0.5);
  }

  async function setSound(on) {
    initAudio();
    soundOn = on;
    if (on) await ac.resume(); else await ac.suspend();
    $('#sound').setAttribute('aria-pressed', on);
    $('#sound').textContent = on ? '♫ Звон слышен' : '♫ Звон';
    if (on) bell(BELL_NOTES[2], 0.14);
  }
  $('#sound').onclick = () => setSound(!soundOn).catch(() => { $('#sound').textContent = 'Звук недоступен'; });

  let firstGesture = true;
  function wakeSound() {
    if (firstGesture) { firstGesture = false; if (!ac) setSound(true).catch(() => {}); }
  }

  /* ============================== ПЕРЕХОДЫ И ИНТЕРФЕЙС ============================== */

  const st = { push: 0, enter: 0, arrive: 0, moon: 0 };
  let where = 'gate';
  let isOpen = false, hover = false, busy = false;

  const ui = {
    toggle: $('#toggle'), enter: $('#enter'), exit: $('#exit'),
    legend: $('#legend'), subtitle: $('#subtitle'), flash: $('#flash')
  };

  const GATE_LEGEND = 'Говорят, в тихую ночь из-под воды слышен колокольный звон, а тем, кто чист сердцем, град открывает свои ворота.';
  const CITY_LEGEND = 'Коснитесь лодки, а затем воды — она поплывёт туда. Вода пускает огонёк, башня — колокол, луна — дорожку.';
  const BOAT_LEGEND = 'Лодка ждёт. Коснитесь воды, куда ей плыть.';

  function toggle() {
    if (busy || where !== 'gate') return;
    wakeSound();
    isOpen = !isOpen;
    const leaves = gate.leaves;
    gsap.killTweensOf(leaves.map(l => l.uAngle));
    gsap.killTweensOf([gate.uni.uGlow, st]);

    if (isOpen) {
      // Сначала короткий толчок у засова, затем створки тяжело расходятся.
      leaves.forEach((l, i) => {
        gsap.timeline({ delay: i * 0.18 * K })
          .to(l.uAngle, { value: 0.06, duration: 0.25 * K, ease: 'power1.out' })
          .to(l.uAngle, { value: 1.62 - i * 0.07, duration: 2.6 * K, ease: 'power2.inOut' }, '+=' + 0.2 * K);
      });
      gsap.to(gate.uni.uGlow, { value: 1, duration: 3 * K, delay: 0.3 * K, ease: 'power1.inOut' });
      gsap.to(st, { push: 1, duration: 3.6 * K, ease: 'power2.inOut' });
      creak(2.6 * K);
      setMuffle(5200, 0.4);
      setTimeout(() => peal(5, 0.55), 900 * K);
    } else {
      leaves.forEach((l, i) => gsap.to(l.uAngle, { value: 0, duration: 2.2 * K, delay: (1 - i) * 0.15 * K, ease: 'power2.inOut' }));
      gsap.to(gate.uni.uGlow, { value: 0, duration: 2.4 * K, ease: 'power1.inOut' });
      gsap.to(st, { push: 0, duration: 2.8 * K, ease: 'power2.inOut' });
      creak(2 * K);
      setMuffle(520, 1.6);
    }
    ui.toggle.textContent = isOpen ? 'Закрыть двери' : 'Открыть двери';
    ui.enter.hidden = !isOpen;
    ui.legend.classList.toggle('on', isOpen);
  }
  ui.toggle.onclick = toggle;

  // Пролёт сквозь сени: камера уходит в проём, кадр заливает золотом, за ним — город.
  function enterCity() {
    if (busy || !isOpen || where !== 'gate') return;
    busy = true;
    wakeSound();
    ui.toggle.hidden = ui.enter.hidden = true;
    ui.legend.classList.remove('on');
    gsap.to(st, { enter: 1, duration: 2.4 * K, ease: 'power2.in' });
    gsap.to(ui.flash, {
      opacity: 1, duration: 1.1 * K, delay: 1.3 * K, ease: 'power1.in',
      onComplete: () => {
        where = 'city';
        st.arrive = 1;
        hover = false;
        $('#stage').classList.remove('hot');
        ui.subtitle.textContent = 'По ту сторону ворот';
        ui.legend.textContent = CITY_LEGEND;
        gsap.to(st, { arrive: 0, duration: 3.2 * K, ease: 'power2.out' });
        gsap.to(ui.flash, {
          opacity: 0, duration: 1.8 * K, ease: 'power1.out',
          onComplete: () => {
            busy = false;
            ui.exit.hidden = false;
            ui.legend.classList.add('on');
          }
        });
        setMuffle(9000);
        peal(4, 0.7);
      }
    });
  }
  ui.enter.onclick = enterCity;

  function leaveCity() {
    if (busy || where !== 'city') return;
    busy = true;
    ui.exit.hidden = true;
    ui.legend.classList.remove('on');
    gsap.to(ui.flash, {
      opacity: 1, duration: 1.1 * K, ease: 'power1.in',
      onComplete: () => {
        where = 'gate';
        st.enter = 0.75;
        ui.subtitle.textContent = 'Невидимый град на озере Светлояр';
        ui.legend.textContent = GATE_LEGEND;
        gsap.to(st, { enter: 0, duration: 2.8 * K, ease: 'power2.out' });
        gsap.to(ui.flash, {
          opacity: 0, duration: 1.6 * K, ease: 'power1.out',
          onComplete: () => {
            busy = false;
            ui.toggle.hidden = ui.enter.hidden = false;
            ui.legend.classList.add('on');
          }
        });
        setMuffle(5200);
      }
    });
  }
  ui.exit.onclick = leaveCity;

  function toggleMoon() {
    const on = city.uni.uMoon.value < 0.5;
    gsap.to(city.uni.uMoon, { value: on ? 1 : 0, duration: 2.5 * K, ease: 'power1.inOut' });
    if (on) bell(BELL_NOTES[4] * 2, 0.05);
  }

  /* ============================== УКАЗАТЕЛЬ ============================== */

  const ndc = new THREE.Vector2();
  const ray = new THREE.Raycaster();
  const zPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  const hit = new THREE.Vector3();
  const look = { x: 0, y: 0 };

  function pointerToPx(e) {
    ndc.set(e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2);
    ray.setFromCamera(ndc, camera);
    if (!ray.ray.intersectPlane(zPlane, hit)) return null;
    return { x: hit.x * 100 + IW / 2, y: IH / 2 - hit.y * 100 };
  }

  const stage = $('#stage');
  stage.addEventListener('pointermove', e => {
    look.x = e.clientX / innerWidth * 2 - 1;
    look.y = 1 - e.clientY / innerHeight * 2;
    if (busy) return;
    const p = pointerToPx(e);
    hover = where === 'gate' && gate.isOver(p);
    const hot = hover || (where === 'city' && (city.boatAt(p) >= 0 || city.isWater(p) || city.bellAt(p) >= 0 || city.isMoon(p)));
    stage.classList.toggle('hot', !!hot);
  });
  stage.addEventListener('pointerleave', () => { hover = false; look.x = look.y = 0; stage.classList.remove('hot'); });
  stage.addEventListener('click', e => {
    if (busy) return;
    const p = pointerToPx(e);
    if (where === 'gate') {
      if (gate.isOver(p)) toggle();
      return;
    }
    wakeSound();
    const boat = city.boatAt(p);
    if (boat >= 0) {
      const sel = city.select(boat);
      ui.legend.textContent = sel >= 0 ? BOAT_LEGEND : CITY_LEGEND;
      noiseBurst(0.08, 300, 1.5, 0.08);
      return;
    }
    if (city.hasSelection() && city.isWater(p)) {
      city.sendBoat(p.x, p.y);
      city.ripple(p.x, p.y);
      ui.legend.textContent = CITY_LEGEND;
      plop();
      return;
    }
    const b = city.bellAt(p);
    if (b >= 0) {
      city.ringBell(b);
      bell(BELL_NOTES[b + 1], 0.2);
    } else if (city.isMoon(p)) {
      toggleMoon();
    } else if (city.isWater(p)) {
      city.ripple(p.x, p.y);
      city.launch(p.x, p.y);
      plop();
    }
  });

  /* ============================== КАМЕРА И КАДР ============================== */

  let fitZ = 10;
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    // Кадр чуть крупнее экрана, чтобы параллаксу было куда сдвигаться без пустых краёв.
    const visH = Math.min(IH / 100, (IW / 100) / camera.aspect) * 0.92;
    fitZ = visH / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
    city.uni.uCamRef.value.set(0, 0, fitZ);
    const px = renderer.getPixelRatio() * h / 800;
    gate.sparkMat.uniforms.uPx.value = px;
    city.emberMat.uniforms.uPx.value = px;
  }
  addEventListener('resize', resize);
  resize();

  const camPos = new THREE.Vector3(0, 0, fitZ);
  const camAim = new THREE.Vector3();
  const tmp = new THREE.Vector3();
  const halfTan = () => Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  let last = performance.now(), stopped = false, lastWhere = where;

  function clampToPhoto(x, y, z) {
    const halfH = z * halfTan();
    const halfW = halfH * camera.aspect;
    const maxX = Math.max(0, IW / 200 - halfW), maxY = Math.max(0, IH / 200 - halfH);
    return [THREE.MathUtils.clamp(x, -maxX, maxX), THREE.MathUtils.clamp(y, -maxY, maxY)];
  }

  function frame(now) {
    if (stopped) return;
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    clock.value += dt;
    const par = reduced ? 0 : 1;

    // При смене сцены камера встаёт сразу на нужное место, без пролёта через полэкрана.
    const snap = lastWhere !== where;
    lastWhere = where;

    if (where === 'gate') {
      const ajar = hover && !isOpen && st.push < 0.01 ? 0.045 : 0;
      gate.leaves.forEach(l => {
        if (!gsap.isTweening(l.uAngle) && !isOpen) l.uAngle.value += (ajar - l.uAngle.value) * (1 - Math.exp(-dt * 6));
        l.pivot.rotation.y = l.sign * l.uAngle.value;
      });

      const p = st.push;
      const zOpen = fitZ * (1 - 0.36 * p);
      if (st.enter > 0) {
        // Влёт в сени: ось камеры идёт точно в центр проёма.
        const e = st.enter;
        const [cx, cy] = clampToPhoto(gate.DOOR_X * p, gate.DOOR_CY * 0.7 * p, zOpen);
        tmp.set(THREE.MathUtils.lerp(cx, gate.DOOR_X, e), THREE.MathUtils.lerp(cy, gate.DOOR_CY + 0.1, e), THREE.MathUtils.lerp(zOpen, -1.4, e));
        camPos.copy(tmp);
      } else {
        const [cx, cy] = clampToPhoto(gate.DOOR_X * p + look.x * 0.14 * par, gate.DOOR_CY * 0.7 * p + look.y * 0.07 * par, zOpen);
        tmp.set(cx, cy, zOpen);
        if (snap) camPos.copy(tmp); else camPos.lerp(tmp, 1 - Math.exp(-dt * 3));
      }
    } else {
      // В городе: лёгкое дыхание камеры, параллакс за указателем и отъезд после входа.
      const a = st.arrive;
      const z = fitZ * (1 - 0.42 * a);
      const sway = par * 0.04;
      const [cx, cy] = clampToPhoto(
        look.x * 0.32 * par + Math.sin(clock.value * 0.21) * sway,
        look.y * 0.14 * par + Math.sin(clock.value * 0.17) * sway * 0.5 + 0.12 * a,
        z
      );
      tmp.set(cx, cy, z);
      if (snap) camPos.copy(tmp); else camPos.lerp(tmp, 1 - Math.exp(-dt * 2.5));
      city.updateLights();
      city.updateBoats(dt);
    }

    camera.position.copy(camPos);
    camAim.set(camPos.x, camPos.y, camPos.z - 10);
    camera.lookAt(camAim);

    if (soundOn) {
      bellTimer -= dt;
      if (bellTimer <= 0) {
        if (where === 'gate') bell(BELL_NOTES[Math.floor(Math.random() * BELL_NOTES.length)], isOpen ? 0.08 : 0.16);
        else bell(BELL_NOTES[Math.floor(Math.random() * BELL_NOTES.length)] * 2, 0.05);
        bellTimer = 8 + Math.random() * 9;
      }
      if (where === 'city') {
        crackleTimer -= dt;
        if (crackleTimer <= 0) {
          noiseBurst(0.04 + Math.random() * 0.05, 1800 + Math.random() * 2500, 2, 0.05 + Math.random() * 0.05);
          crackleTimer = 0.08 + Math.random() * 0.5;
        }
      }
    }

    renderer.render(where === 'gate' ? gate.scene : city.scene, camera);
  }

  renderer.domElement.addEventListener('webglcontextlost', e => {
    e.preventDefault();
    stopped = true;
    fail('WebGL-контекст потерян. Перезагрузите страницу.');
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (ac) ac.suspend(); }
    else { last = performance.now(); if (ac && soundOn) ac.resume().catch(() => {}); }
  });

  requestAnimationFrame(frame);
  requestAnimationFrame(() => veil.classList.add('gone'));
}
</script>
</body>
</html>
