<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Врата Китежа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap">
<style>
/* Один кадр во весь экран; интерфейс — тихие подписи по краям, как титры к фильму */
:root{
  color-scheme:dark;
  --night:#060b10;
  --bone:#e9e1cf;
  --mist:#9fb0b8;
  --ember:#e7b56a;
  --line:#e9e1cf2e;
  --glass:#060b10a8;
  --display:'Cormorant SC','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --body:'Cormorant Garamond',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--bone);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:manipulation}
#stage canvas{display:block;width:100%;height:100%}
#stage.hot{cursor:pointer}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--ember);outline-offset:4px}

.title{
  position:fixed;
  top:calc(28px + env(safe-area-inset-top,0px));
  left:max(28px,env(safe-area-inset-left,0px));
  pointer-events:none;text-shadow:0 2px 18px #000
}
.title h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,4vw,52px);letter-spacing:.32em;margin:0;line-height:1}
.title p{margin:10px 0 0;font-style:italic;font-size:17px;color:var(--mist);letter-spacing:.04em}

#sound{
  position:fixed;
  top:calc(28px + env(safe-area-inset-top,0px));
  right:max(28px,env(safe-area-inset-right,0px));
  background:var(--glass);border:1px solid var(--line);border-radius:99px;
  padding:9px 16px;font-family:var(--display);font-size:14px;letter-spacing:.16em;
  backdrop-filter:blur(10px)
}
#sound[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}

.foot{
  position:fixed;left:0;right:0;
  bottom:calc(26px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:14px;pointer-events:none;text-align:center
}
#legend{
  max-width:34em;margin:0;font-style:italic;font-size:clamp(16px,1.6vw,20px);line-height:1.45;
  color:var(--bone);text-shadow:0 2px 14px #000,0 0 30px #000;
  opacity:0;transform:translateY(8px);transition:opacity 1.6s ease,transform 1.6s ease
}
#legend.on{opacity:.92;transform:none}
.buttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pill{
  pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:99px;
  padding:11px 22px;font-family:var(--display);font-size:15px;letter-spacing:.2em;
  backdrop-filter:blur(10px);transition:border-color .3s,color .3s
}
.pill:hover{border-color:var(--ember);color:var(--ember)}
.pill.gold{border-color:var(--ember);color:var(--ember)}

#world{position:fixed;inset:0;width:100%;height:100%;display:none;touch-action:none;outline:none;z-index:1}
.title,#sound,.foot{z-index:2}
#oops{position:fixed;left:16px;right:16px;top:calc(110px + env(safe-area-inset-top,0px));z-index:6;margin:0 auto;max-width:560px;padding:12px 16px;border:1px solid #c0583a;background:#1a0c08e6;color:#f3d6c8;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;border-radius:6px}
#oops[hidden]{display:none}
#stick{position:fixed;left:max(24px,env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));
  width:124px;height:124px;border-radius:50%;border:1px solid var(--line);background:#060b1066;backdrop-filter:blur(6px);touch-action:none;z-index:3}
#stick i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#e7b56a40;border:1px solid var(--ember)}
#stick[hidden]{display:none}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:4;
  background:radial-gradient(circle at 50% 55%,#fff8e6 0%,#ffd98f 35%,#c98236 75%,#4a2810 100%)}

#veil{position:fixed;inset:0;background:var(--night);display:grid;place-content:center;
  font-family:var(--display);letter-spacing:.4em;color:var(--ember);transition:opacity 1.2s ease;z-index:5}
#veil.gone{opacity:0;pointer-events:none}
#veil p{max-width:440px;padding:24px;line-height:1.7;letter-spacing:.05em;font-family:var(--body);color:var(--bone);text-align:center}

@media (max-width:640px){
  .title p{font-size:15px}
  #sound{padding:8px 12px;font-size:12px}
  .pill{padding:10px 16px;font-size:13px;letter-spacing:.14em}
}
@media (prefers-reduced-motion:reduce){
  #legend{transition:none}
}
</style>
</head>
<body>
<div id="stage" aria-label="Деревянный терем Китежа, стоящий в озере. Двери можно открыть и войти в город на лодке."></div>

<div class="title">
  <h1>Китеж</h1>
  <p id="subtitle">Невидимый град на озере Светлояр</p>
</div>

<button id="sound" aria-pressed="false">♫ Звон</button>

<div class="foot">
  <p id="legend">Говорят, в тихую ночь из-под воды слышен колокольный звон, а тем, кто чист сердцем, град открывает свои ворота.</p>
  <div class="buttons">
    <button id="toggle" class="pill">Открыть двери</button>
    <button id="enter" class="pill gold" hidden>Войти в град</button>
    <button id="exit" class="pill" hidden>Выйти</button>
  </div>
</div>

<div id="stick" hidden aria-label="Джойстик: грести и поворачивать"><i></i></div>
<div id="flash"></div>
<div id="oops" role="alert" hidden></div>
<div id="veil">КИТЕЖ</div>

const $ = s => document.querySelector(s);
const veil = $('#veil');

// Если в браузере что-то падает, текст ошибки виден на экране — его можно прислать.
function showError(msg) {
  const el = document.getElementById('oops');
  if (!el) return;
  el.hidden = false;
  el.textContent = ('Ошибка: ' + msg).slice(0, 600) + (el.textContent ? '\n' + el.textContent : '');
}
addEventListener('error', e => showError((e.message || 'неизвестная') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')));
addEventListener('unhandledrejection', e => showError(String(e.reason && e.reason.message || e.reason)));

function fail(msg) {
  veil.classList.remove('gone');
  veil.innerHTML = '<p></p>';
  veil.querySelector('p').textContent = msg;
}

function loadImage(src) {
  return new Promise((ok, bad) => {
    const i = new Image();
    i.onload = () => ok(i);
    i.onerror = bad;
    i.src = src;
  });
}

if (!window.THREE || !window.gsap) {
  fail('Не удалось загрузить Three.js и GSAP. Откройте страницу с доступом к интернету.');
} else {
  Promise.all([loadImage(PHOTO_GATE), loadImage(PHOTO_CITY)])
    .then(([a, b]) => {
      try { boot(a, b); } catch (e) { console.error(e); fail('Сцена не запустилась: ' + e.message + '. Нужен браузер с WebGL.'); }
    })
    .catch(() => fail('Не удалось прочитать изображения.'));
}

function boot(imgGate, imgCity) {
  // Оба фото 1024×572: 1 пиксель = 0.01 единицы сцены, центр кадра в нуле.
  const IW = 1024, IH = 572;
  const X = px => (px - IW / 2) / 100;
  const Y = py => (IH / 2 - py) / 100;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const K = reduced ? 0.35 : 1;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setClearColor(0x060b10);
  // Тональная кривая действует только на материалы града; шейдеры врат пишут цвет напрямую.
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  $('#stage').appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);

  function photoTexture(img) {
    const t = new THREE.Texture(img);
    t.colorSpace = THREE.NoColorSpace;
    t.minFilter = THREE.LinearFilter;
    t.generateMipmaps = false;
    t.needsUpdate = true;
    return t;
  }

  const glsl = `
    uniform float uTime;
    const vec3 WARM = vec3(1.0, 0.68, 0.34);
    vec2 toPx(vec2 uv) { return vec2(uv.x * 1024.0, (1.0 - uv.y) * 572.0); }
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
    }
    // Мерцание тёплых светлых пикселей рядом с огнями. l = (x, y, фаза), l.z > 10 — костёр, шире и сильнее.
    float flickerK(vec2 px, vec3 l) {
      float big = step(10.0, l.z);
      float ph = mod(l.z, 10.0);
      float d = distance(px, l.xy);
      float w = exp(-d * d / mix(800.0, 2600.0, big));
      float f = sin(uTime * 7.1 + ph * 3.0) * 0.5 + sin(uTime * 13.7 + ph * 5.0) * 0.3
              + (noise(vec2(uTime * mix(5.0, 9.0, big) + ph * 10.0, ph)) - 0.5) * mix(1.0, 1.8, big);
      return w * f;
    }
    vec3 applyFlicker(vec3 c, float k) {
      float lum = dot(c, vec3(0.3, 0.59, 0.11));
      float warm = smoothstep(0.2, 0.65, lum) * clamp((c.r - c.b) * 3.0, 0.0, 1.0);
      return c * (1.0 + k * 0.28 * warm);
    }
  `;

  const passUv = `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
  `;

  const clock = { value: 0 };

  /* ============================== СЦЕНА 1: ВРАТА ============================== */

  const gate = (() => {
    const scene = new THREE.Scene();
    const DOOR = { l: 451, r: 579, t: 317, b: 440 };
    const WATER = 440;
    const DOOR_W = (DOOR.r - DOOR.l) / 100;
    const DOOR_H = (DOOR.b - DOOR.t) / 100;
    const LEAF_W = DOOR_W / 2;
    const DOOR_CY = Y((DOOR.t + DOOR.b) / 2);
    const DEPTH = 2.6;

    const lamps = [
      [513,237,0.1],[612,328,1.3],[418,329,2.6],[791,358,3.4],[221,363,4.7],[343,241,5.9],
      [413,544,2.6],[614,547,1.3],[413,567,2.6],[614,569,1.3]
    ].map(v => new THREE.Vector3(...v));

    const uni = {
      uMap: { value: photoTexture(imgGate) },
      uTime: clock,
      uGlow: { value: 0 },
      uLamps: { value: lamps },
      uDoor: { value: new THREE.Vector4(DOOR.l, DOOR.t, DOOR.r, DOOR.b) }
    };

    const common = glsl + `
      uniform sampler2D uMap;
      uniform float uGlow;
      uniform vec3 uLamps[10];
      vec3 flicker(vec3 c, vec2 px) {
        float k = 0.0;
        for (int i = 0; i < 10; i++) k += flickerK(px, uLamps[i]);
        return applyFlicker(c, k);
      }
    `;

    // Фасад с вырезанным проёмом, рябь воды и отсвет из дверей.
    scene.add(new THREE.Mesh(
      new THREE.PlaneGeometry(IW / 100, IH / 100),
      new THREE.ShaderMaterial({
        uniforms: uni,
        vertexShader: passUv,
        fragmentShader: common + `
          uniform vec4 uDoor;
          varying vec2 vUv;
          void main() {
            vec2 uv = vUv;
            vec2 px = toPx(uv);
            if (px.x > uDoor.x && px.x < uDoor.z && px.y > uDoor.y && px.y < uDoor.w) discard;

            float below = px.y - 440.0;
            if (below > 0.0) {
              float a = (0.6 + 1.8 * below / 132.0) * smoothstep(0.0, 6.0, below);
              uv.x += (sin(px.y * 0.55 - uTime * 1.6 + noise(px * vec2(0.02, 0.15) + uTime * 0.3) * 5.0) * 0.0011
                     + (noise(vec2(px.x * 0.01, px.y * 0.08 - uTime * 0.6)) - 0.5) * 0.0025) * a;
              uv.y += sin(px.x * 0.05 + uTime * 1.1 + px.y * 0.2) * 0.0009 * a;
            }

            vec3 c = flicker(texture2D(uMap, uv).rgb, px);

            float facade = exp(-pow(length((px - vec2(515.0, 395.0)) / vec2(115.0, 80.0)), 2.0)) * step(px.y, 440.0);
            c += WARM * facade * uGlow * (c * 1.4 + 0.03);

            if (below > 0.0) {
              float wob = (noise(vec2(px.y * 0.09 - uTime * 0.9, 1.0)) - 0.5) * 34.0 * (below / 132.0);
              float dx = (px.x - 515.0 + wob) / (60.0 + below * 0.4);
              float streak = exp(-dx * dx * 2.5) * exp(-below / 150.0);
              float br = 0.5 + 0.5 * sin(px.y * 1.1 + uTime * 2.3 + noise(px * 0.05) * 4.0);
              c += WARM * streak * br * 0.8 * uGlow;
            }
            gl_FragColor = vec4(c, 1.0);
          }
        `
      })
    ));

    // Внутри: сени из брёвен, вода на полу и сияние града в глубине.
    function backWall() {
      const c = document.createElement('canvas');
      c.width = c.height = 512;
      const g = c.getContext('2d');
      let q = g.createRadialGradient(256, 300, 10, 256, 300, 380);
      q.addColorStop(0, '#fff6dc');
      q.addColorStop(0.25, '#ffd58a');
      q.addColorStop(0.6, '#b9732e');
      q.addColorStop(1, '#3a1f0c');
      g.fillStyle = q;
      g.fillRect(0, 0, 512, 512);

      g.fillStyle = 'rgba(120,70,25,0.55)';
      const domes = [[70,300,26],[130,268,34],[200,240,40],[256,200,52],[318,236,40],[384,262,34],[446,298,26]];
      g.beginPath();
      g.moveTo(0, 360);
      for (const [x, y, r] of domes) {
        g.lineTo(x - r * 0.8, 360);
        g.lineTo(x - r * 0.8, y + r * 1.2);
        g.lineTo(x - r * 0.55, y + r * 1.2);
        g.bezierCurveTo(x - r * 1.05, y + r * 0.3, x - r * 0.25, y - r * 0.35, x, y - r * 1.05);
        g.bezierCurveTo(x + r * 0.25, y - r * 0.35, x + r * 1.05, y + r * 0.3, x + r * 0.55, y + r * 1.2);
        g.lineTo(x + r * 0.8, y + r * 1.2);
        g.lineTo(x + r * 0.8, 360);
      }
      g.lineTo(512, 360);
      g.lineTo(512, 512);
      g.lineTo(0, 512);
      g.fill();
      for (const [x, y, r] of domes) {
        g.fillRect(x - 1.5, y - r * 1.6, 3, r * 0.6);
        g.fillRect(x - r * 0.18, y - r * 1.42, r * 0.36, 3);
      }
      for (let i = 0; i < 60; i++) {
        const [x, y, r] = domes[i % domes.length];
        g.fillStyle = `rgba(255,236,180,${0.35 + Math.random() * 0.4})`;
        g.fillRect(x - r * 0.6 + Math.random() * r * 1.2, y + r * 1.3 + Math.random() * (360 - y - r * 1.4), 3, 5);
      }
      q = g.createLinearGradient(0, 220, 0, 512);
      q.addColorStop(0, 'rgba(255,230,170,0)');
      q.addColorStop(0.55, 'rgba(255,220,150,0.45)');
      q.addColorStop(1, 'rgba(120,70,30,0.6)');
      g.fillStyle = q;
      g.fillRect(0, 0, 512, 512);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.NoColorSpace;
      return t;
    }

    const roomW = DOOR_W + 0.12, roomH = DOOR_H + 0.08;
    const room = new THREE.Mesh(
      new THREE.BoxGeometry(roomW, roomH, DEPTH),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: { ...uni, uBack: { value: backWall() }, uSize: { value: new THREE.Vector3(roomW, roomH, DEPTH) } },
        vertexShader: `
          varying vec3 vP; varying vec3 vN;
          void main() { vP = position; vN = normal; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
        `,
        fragmentShader: common + `
          uniform sampler2D uBack;
          uniform vec3 uSize;
          varying vec3 vP; varying vec3 vN;
          void main() {
            float t = clamp((uSize.z * 0.5 - vP.z) / uSize.z, 0.0, 1.0);
            float glow = 0.25 + 0.75 * uGlow;
            vec3 c;
            if (vN.z < -0.5) {
              c = texture2D(uBack, vP.xy / uSize.xy + 0.5).rgb * glow;
            } else if (abs(vN.x) > 0.5) {
              float f = fract((vP.y + uSize.y * 0.5) / 0.115);
              float lg = smoothstep(0.0, 0.18, f) * smoothstep(1.0, 0.72, f);
              float grain = 0.8 + 0.4 * noise(vec2(vP.z * 30.0, vP.y * 9.0));
              c = vec3(0.16, 0.1, 0.055) * (0.3 + 0.7 * lg) * grain * (0.4 + 3.2 * t * t) * glow;
            } else if (vP.y > 0.0) {
              float beam = step(0.75, fract(vP.z * 3.0));
              c = vec3(0.07, 0.045, 0.025) * (1.0 - 0.5 * beam) * (0.4 + 2.5 * t * t) * glow;
            } else {
              float r = noise(vec2(vP.x * 9.0, vP.z * 16.0 + uTime * 0.8));
              c = vec3(0.012, 0.02, 0.025) + WARM * (0.1 + 0.9 * t * t) * (0.3 + 1.4 * pow(r, 3.0)) * glow;
            }
            c = mix(c, WARM * 1.05 * glow, smoothstep(0.25, 1.0, t) * 0.4);
            gl_FragColor = vec4(c, 1.0);
          }
        `
      })
    );
    room.position.set(X((DOOR.l + DOOR.r) / 2), Y(WATER) + roomH / 2, -DEPTH / 2 - 0.002);
    scene.add(room);

    // Створки: тот же фрагмент фото на петлях, плюс торец толщиной 5 см.
    function leaf(side) {
      const pivot = new THREE.Group();
      const left = side < 0;
      const px0 = left ? DOOR.l : (DOOR.l + DOOR.r) / 2;
      const px1 = left ? (DOOR.l + DOOR.r) / 2 : DOOR.r;
      pivot.position.set(X(left ? DOOR.l : DOOR.r), DOOR_CY, 0);

      const shift = left ? LEAF_W / 2 : -LEAF_W / 2;
      const leafUni = {
        ...uni,
        uRect: { value: new THREE.Vector4(px0 / IW, 1 - DOOR.b / IH, px1 / IW, 1 - DOOR.t / IH) },
        uAngle: { value: 0 },
        uFreeU: { value: left ? 1 : 0 }
      };

      const face = new THREE.Mesh(
        new THREE.PlaneGeometry(LEAF_W, DOOR_H).translate(shift, 0, 0),
        new THREE.ShaderMaterial({
          uniforms: leafUni,
          vertexShader: passUv,
          fragmentShader: common + `
            uniform vec4 uRect;
            uniform float uAngle;
            uniform float uFreeU;
            varying vec2 vUv;
            void main() {
              vec2 uv = mix(uRect.xy, uRect.zw, vUv);
              vec3 c = flicker(texture2D(uMap, uv).rgb, toPx(uv));
              float s = sin(uAngle);
              float deep = mix(1.0 - vUv.x, vUv.x, uFreeU);
              c *= 1.0 - 0.3 * s;
              c += WARM * uGlow * s * (0.25 + 0.75 * deep) * (c * 2.2 + 0.04);
              gl_FragColor = vec4(c, 1.0);
            }
          `
        })
      );

      const slab = new THREE.Mesh(
        new THREE.BoxGeometry(LEAF_W, DOOR_H, 0.05).translate(shift, 0, -0.026),
        new THREE.ShaderMaterial({
          uniforms: uni,
          vertexShader: passUv,
          fragmentShader: `
            uniform float uGlow;
            void main() { gl_FragColor = vec4(vec3(0.07, 0.045, 0.03) + vec3(0.25, 0.15, 0.07) * uGlow, 1.0); }
          `
        })
      );

      pivot.add(face, slab);
      scene.add(pivot);
      return { pivot, uAngle: leafUni.uAngle, sign: left ? 1 : -1 };
    }

    const leaves = [leaf(-1), leaf(1)];

    // Золотая пыль, которую выносит из сеней наружу.
    const SPARKS = 180;
    const seeds = new Float32Array(SPARKS * 4);
    for (let i = 0; i < seeds.length; i++) seeds[i] = Math.random();
    const sparkGeo = new THREE.BufferGeometry();
    sparkGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(SPARKS * 3), 3));
    sparkGeo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 4));
    const sparkMat = new THREE.ShaderMaterial({
      uniforms: { ...uni, uPx: { value: 1 }, uCenter: { value: new THREE.Vector3(X(515), Y(WATER), 0) } },
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        attribute vec4 aSeed;
        uniform float uTime, uGlow, uPx;
        uniform vec3 uCenter;
        varying float vA;
        void main() {
          float life = fract(uTime * (0.05 + aSeed.w * 0.07) + aSeed.x * 7.0);
          vec3 p = uCenter;
          p.x += (aSeed.x - 0.5) * 1.1 * (1.0 + life * 1.6) + sin(uTime * 0.7 + aSeed.y * 20.0) * 0.06;
          p.y += 0.06 + aSeed.y * 1.1 + life * 0.5 + sin(uTime * 0.9 + aSeed.z * 20.0) * 0.04;
          p.z = mix(-2.3, 2.2, life) * (0.6 + aSeed.z * 0.4);
          vA = sin(life * 3.14159) * uGlow * (0.4 + 0.6 * aSeed.z);
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = (2.0 + aSeed.y * 4.0) * uPx * (8.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying float vA;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          gl_FragColor = vec4(vec3(1.0, 0.78, 0.45) * smoothstep(0.5, 0.0, d) * vA, 1.0);
        }
      `
    });
    const sparks = new THREE.Points(sparkGeo, sparkMat);
    sparks.frustumCulled = false;
    scene.add(sparks);

    // Туман над водой, тёплый у дверей, когда они открыты.
    const fog = new THREE.Mesh(
      new THREE.PlaneGeometry(IW / 100, IH / 100),
      new THREE.ShaderMaterial({
        uniforms: uni,
        transparent: true,
        depthWrite: false,
        vertexShader: passUv,
        fragmentShader: common + `
          varying vec2 vUv;
          float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }
          void main() {
            vec2 px = toPx(vUv);
            float band = exp(-pow((px.y - 425.0) / 75.0, 2.0));
            float f = fbm(px * vec2(0.006, 0.02) + vec2(uTime * 0.03, uTime * 0.004));
            float a = band * smoothstep(0.3, 0.8, f) * 0.42;
            float near = exp(-pow(length((px - vec2(515.0, 425.0)) / vec2(190.0, 70.0)), 2.0));
            vec3 col = mix(vec3(0.38, 0.44, 0.5), WARM * 1.2, uGlow * near);
            gl_FragColor = vec4(col, a * (1.0 + uGlow * near * 0.8));
          }
        `
      })
    );
    fog.position.z = 0.012;
    scene.add(fog);

    const DOOR_X = X(515);
    return {
      scene, uni, leaves, sparkMat, DOOR, DOOR_X, DOOR_CY,
      isOver: p => p && p.x > DOOR.l && p.x < DOOR.r && p.y > DOOR.t && p.y < DOOR.b
    };
  })();

  /* ============================== ИГРА НА BABYLON.JS: ГРАД НА ВОДЕ ============================== */

  // Babylon подгружается заранее, пока зритель у дверей: он тяжёлый (~7 МБ).
  const BJS_CORE = 'https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js';
  const BJS_WATER = 'https://cdn.jsdelivr.net/npm/babylonjs-materials@7.54.3/babylon.waterMaterial.min.js';
  let babylonReady = null;
  function loadScript(src) {
    return new Promise((ok, bad) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = ok;
      s.onerror = () => bad(new Error('Не загрузился ' + src));
      document.head.appendChild(s);
    });
  }
  function loadBabylon() {
    if (!babylonReady) babylonReady = loadScript(BJS_CORE).then(() => loadScript(BJS_WATER));
    return babylonReady;
  }

  function createWorld() {
    const B = BABYLON;
    const V3 = (x, y, z) => new B.Vector3(x, y, z);

    const canvas = document.createElement('canvas');
    canvas.id = 'world';
    canvas.setAttribute('aria-label', 'Ночной град на воде. Лодкой управляют клавиши W A S D или джойстик.');
    document.getElementById('stage').after(canvas);   // сразу после сцены дверей и поверх неё

    // На телефонах облегчаем: меньше пикселей, отражения в половинном разрешении, без мультисэмплинга.
    const lite = matchMedia('(pointer: coarse)').matches;
    const engine = new B.Engine(canvas, true, { stencil: true, preserveDrawingBuffer: false }, true);
    B.Logger.OnNewCacheEntry = entry => { if (/error/i.test(entry) && /BJS/.test(entry)) showError(entry.replace(/<[^>]+>/g, '').slice(0, 300)); };
    engine.setHardwareScalingLevel(1 / Math.min(devicePixelRatio, lite ? 1.25 : 1.5));
    const scene = new B.Scene(engine);
    const FOG = new B.Color3(0.075, 0.105, 0.135);
    scene.clearColor = new B.Color4(FOG.r, FOG.g, FOG.b, 1);
    scene.fogMode = B.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.012;
    scene.fogColor = FOG;
    scene.ambientColor = new B.Color3(0.25, 0.28, 0.34);
    scene.skipPointerMovePicking = true;

    const MOON_DIR = V3(0.3, 0.42, -0.86).normalize();   // направление НА луну
    const PLAT_Y = 0.8;
    const LAKE = { x: 0, z: -60, r: 128 };
    const MAXL = 8;

    let seed = 20261031;
    const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const pick = a => a[Math.floor(rnd() * a.length)];

    /* ---------- текстуры: рисуем на холсте, из той же картинки строим карту нормалей ---------- */

    function paint(size, draw) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      draw(c.getContext('2d'), size);
      return c;
    }
    function tex(name, c, wrap = true) {
      const t = new B.DynamicTexture(name, c, scene, true);
      t.update(false);
      if (wrap) t.wrapU = t.wrapV = B.Texture.WRAP_ADDRESSMODE;
      t.anisotropicFilteringLevel = 4;
      return t;
    }
    // Рельеф из яркости: светлое выступает, тёмные щели между брёвнами уходят вглубь.
    function normalMap(name, src, strength) {
      const S = src.width;
      const d = src.getContext('2d').getImageData(0, 0, S, S).data;
      const h = new Float32Array(S * S);
      for (let i = 0; i < S * S; i++) h[i] = (d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11) / 255;
      const c = document.createElement('canvas');
      c.width = c.height = S;
      const g = c.getContext('2d');
      const o = g.createImageData(S, S);
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        const hx = h[y * S + (x + 1) % S] - h[y * S + (x - 1 + S) % S];
        const hy = h[((y + 1) % S) * S + x] - h[((y - 1 + S) % S) * S + x];
        let nx = -hx * strength, ny = hy * strength, nz = 1;
        const l = Math.hypot(nx, ny, nz);
        const i = (y * S + x) * 4;
        o.data[i] = (nx / l * 0.5 + 0.5) * 255;
        o.data[i + 1] = (ny / l * 0.5 + 0.5) * 255;
        o.data[i + 2] = (nz / l * 0.5 + 0.5) * 255;
        o.data[i + 3] = 255;
      }
      g.putImageData(o, 0, 0);
      return tex(name, c);
    }
    const rgb = (c, k = 1, a = 1) => `rgba(${Math.round(c[0] * k)},${Math.round(c[1] * k)},${Math.round(c[2] * k)},${a})`;

    // Брёвна сруба: 8 венцов на 2,8 м.
    const logC = paint(512, (g, S) => {
      const n = 8, hgt = S / n;
      for (let i = 0; i < n; i++) {
        const y0 = i * hgt;
        const base = [84 + rnd() * 14, 72 + rnd() * 10, 60 + rnd() * 8];
        const q = g.createLinearGradient(0, y0, 0, y0 + hgt);
        q.addColorStop(0, rgb(base, 0.2));
        q.addColorStop(0.14, rgb(base, 0.78));
        q.addColorStop(0.42, rgb(base, 1.1));
        q.addColorStop(0.82, rgb(base, 0.66));
        q.addColorStop(1, rgb(base, 0.16));
        g.fillStyle = q;
        g.fillRect(0, y0, S, hgt);
        for (let k = 0; k < 40; k++) {
          g.strokeStyle = `rgba(28,18,10,${0.12 + rnd() * 0.25})`;
          g.lineWidth = 0.6 + rnd() * 1.3;
          const yy = y0 + 6 + rnd() * (hgt - 12);
          g.beginPath();
          g.moveTo(0, yy);
          for (let x = 32; x <= S; x += 32) g.lineTo(x, yy + (rnd() - 0.5) * 2.4);
          g.stroke();
        }
        for (let k = 0; k < 3; k++) {
          g.fillStyle = 'rgba(30,18,10,0.65)';
          g.beginPath(); g.ellipse(rnd() * S, y0 + hgt * (0.3 + rnd() * 0.4), 5 + rnd() * 5, 3 + rnd() * 2, 0, 0, Math.PI * 2); g.fill();
        }
      }
      for (let k = 0; k < 280; k++) {
        g.fillStyle = `rgba(${60 + rnd() * 20},${80 + rnd() * 24},${42 + rnd() * 14},${0.12 + rnd() * 0.25})`;
        g.beginPath(); g.arc(rnd() * S, S * (0.7 + rnd() * 0.3), 3 + rnd() * 9, 0, Math.PI * 2); g.fill();
      }
    });
    const roofC = paint(512, (g, S) => {
      g.fillStyle = '#2b2620';
      g.fillRect(0, 0, S, S);
      for (let y = 0, r = 0; y < S; y += 28, r++) {
        let x = (r % 2) * -14;
        while (x < S) {
          const w = 18 + rnd() * 18;
          g.fillStyle = rgb([72, 64, 54], 0.6 + rnd() * 0.5);
          g.fillRect(x + 1, y + 1, w - 2, 26);
          g.fillStyle = 'rgba(0,0,0,0.4)';
          g.fillRect(x + 1, y + 21, w - 2, 6);
          x += w;
        }
      }
      for (let k = 0; k < 420; k++) {
        g.fillStyle = `rgba(${58 + rnd() * 30},${84 + rnd() * 30},${38 + rnd() * 16},${0.1 + rnd() * 0.3})`;
        g.beginPath(); g.arc(rnd() * S, rnd() * S, 2 + rnd() * 12, 0, Math.PI * 2); g.fill();
      }
    });
    const boardC = paint(512, (g, S) => {
      for (let x = 0; x < S; x += 32) {
        g.fillStyle = rgb([70 + rnd() * 18, 58 + rnd() * 14, 46 + rnd() * 10], 0.85);
        g.fillRect(x, 0, 32, S);
        for (let k = 0; k < 10; k++) {
          g.strokeStyle = `rgba(20,14,10,${0.15 + rnd() * 0.2})`;
          const xx = x + 3 + rnd() * 26;
          g.beginPath(); g.moveTo(xx, 0); g.lineTo(xx + (rnd() - 0.5) * 3, S); g.stroke();
        }
        g.fillStyle = 'rgba(10,6,4,0.75)';
        g.fillRect(x, 0, 2, S);
        g.fillRect(x, rnd() * S, 32, 2);
      }
    });
    const windowC = paint(128, (g, S) => {
      const q = g.createRadialGradient(S / 2, S * 0.55, 4, S / 2, S * 0.55, S * 0.7);
      q.addColorStop(0, '#ffe2a0');
      q.addColorStop(0.5, '#f0a050');
      q.addColorStop(1, '#8a3c18');
      g.fillStyle = q;
      g.fillRect(0, 0, S, S);
      g.strokeStyle = '#2a1a10';
      g.lineWidth = 10;
      g.strokeRect(5, 5, S - 10, S - 10);
      g.lineWidth = 5;
      g.beginPath();
      g.moveTo(S / 2, 0); g.lineTo(S / 2, S);
      g.moveTo(0, S / 3); g.lineTo(S, S / 3);
      g.moveTo(0, 2 * S / 3); g.lineTo(S, 2 * S / 3);
      g.stroke();
    });
    const flareC = paint(64, (g, S) => {
      const q = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
      q.addColorStop(0, 'rgba(255,255,255,1)');
      q.addColorStop(0.35, 'rgba(255,255,255,0.5)');
      q.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = q;
      g.fillRect(0, 0, S, S);
    });
    const ringC = paint(128, (g, S) => {
      g.strokeStyle = 'rgba(255,255,255,0.9)';
      g.lineWidth = 6;
      g.filter = 'blur(2px)';
      g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 8, 0, Math.PI * 2); g.stroke();
    });
    // Бесшовная рябь для воды: сумма волн с целым числом периодов.
    const waveC = paint(256, (g, S) => {
      const img = g.createImageData(S, S);
      const waves = Array.from({ length: 14 }, () => ({ kx: Math.round((rnd() - 0.5) * 16), ky: Math.round((rnd() - 0.5) * 16), p: rnd() * 6.283, a: 0.3 + rnd() }));
      for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
        let v = 0;
        for (const w of waves) v += Math.sin((w.kx * x + w.ky * y) / S * 6.283 + w.p) * w.a;
        const c = 128 + v * 9;
        const i = (y * S + x) * 4;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = c;
        img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    });

    // Планарная развёртка в метрах: одна текстура одинаково ложится на все стены.
    function worldUV(mesh, scale = 1 / 2.8) {
      const p = mesh.getVerticesData(B.VertexBuffer.PositionKind);
      const n = mesh.getVerticesData(B.VertexBuffer.NormalKind);
      const uv = new Float32Array(p.length / 3 * 2);
      for (let i = 0; i < p.length / 3; i++) {
        const nx = Math.abs(n[i * 3]), ny = Math.abs(n[i * 3 + 1]), nz = Math.abs(n[i * 3 + 2]);
        let u, v;
        if (ny > nx && ny > nz) { u = p[i * 3]; v = p[i * 3 + 2]; }
        else if (nx > nz) { u = p[i * 3 + 2]; v = p[i * 3 + 1]; }
        else { u = p[i * 3]; v = p[i * 3 + 1]; }
        uv[i * 2] = u * scale;
        uv[i * 2 + 1] = v * scale;
      }
      mesh.setVerticesData(B.VertexBuffer.UVKind, uv, true);
      return mesh;
    }

    function mat(name, opts) {
      const m = new B.StandardMaterial(name, scene);
      m.maxSimultaneousLights = MAXL;
      m.specularColor = new B.Color3(0.05, 0.05, 0.05);
      Object.assign(m, opts);
      return m;
    }
    const logMat = mat('logs', { diffuseTexture: tex('logT', logC), bumpTexture: normalMap('logN', logC, 6) });
    const roofMat = mat('roof', { diffuseTexture: tex('roofT', roofC), bumpTexture: normalMap('roofN', roofC, 5) });
    const boardMat = mat('boards', { diffuseTexture: tex('boardT', boardC), bumpTexture: normalMap('boardN', boardC, 4), specularColor: new B.Color3(0.12, 0.12, 0.12) });
    const darkWood = mat('dark', { diffuseColor: new B.Color3(0.16, 0.11, 0.08) });
    const winLit = mat('win', { emissiveTexture: tex('winT', windowC, false), disableLighting: true, emissiveColor: new B.Color3(0.95, 0.62, 0.34) });
    const winDark = mat('winDark', { diffuseColor: new B.Color3(0.03, 0.04, 0.05) });
    const lampMat = mat('lamp', { emissiveColor: new B.Color3(1.0, 0.66, 0.34), disableLighting: true });
    const flare = tex('flare', flareC, false);
    flare.hasAlpha = true;

    /* ---------- свет ---------- */

    const hemi = new B.HemisphericLight('sky', V3(0, 1, 0), scene);
    hemi.intensity = 0.62;
    hemi.diffuse = new B.Color3(0.55, 0.65, 0.85);
    hemi.groundColor = new B.Color3(0.06, 0.06, 0.07);
    hemi.specular = new B.Color3(0, 0, 0);
    const moon = new B.DirectionalLight('moon', MOON_DIR.scale(-1), scene);
    moon.intensity = 0.7;
    moon.diffuse = new B.Color3(0.65, 0.75, 0.95);
    moon.specular = new B.Color3(0.6, 0.7, 0.9);
    const fill = new B.DirectionalLight('fill', V3(0.3, -0.5, -0.8), scene);
    fill.intensity = 0.32;
    fill.diffuse = new B.Color3(0.45, 0.52, 0.7);
    fill.specular = new B.Color3(0, 0, 0);

    // Тёплых источников много, а настоящих ламп — несколько ближайших к лодке.
    const sources = [];
    const POOL = 4;
    const pool = Array.from({ length: POOL }, (_, i) => {
      const l = new B.PointLight('warm' + i, V3(0, -50, 0), scene);
      l.diffuse = new B.Color3(1, 0.62, 0.32);
      l.specular = new B.Color3(0.5, 0.3, 0.15);
      l.range = 16;
      l.intensity = 0;
      return l;
    });
    const lightSource = (pos, kind) => sources.push({ pos: pos.clone(), kind, phase: rnd() * 10 });

    /* ---------- геометрия построек ---------- */

    const byMat = new Map();   // всё статичное потом сливаем по материалу — так в разы меньше вызовов отрисовки
    function keep(mesh, material) {
      mesh.material = material;
      if (!byMat.has(material)) byMat.set(material, []);
      byMat.get(material).push(mesh);
      return mesh;
    }
    function box(w, h, d, material, uv = 1 / 2.8) {
      const m = B.MeshBuilder.CreateBox('b', { width: w, height: h, depth: d }, scene);
      if (uv) worldUV(m, uv);
      return keep(m, material);
    }
    // Выпуклая призма (фронтон): многоугольник в плоскости xy, вытянут по z.
    function prism(pts, depth, material) {
      const pos = [], idx = [];
      const n = pts.length, hz = depth / 2;
      for (const [x, y] of pts) pos.push(x, y, hz);
      for (const [x, y] of pts) pos.push(x, y, -hz);
      for (let i = 1; i < n - 1; i++) { idx.push(0, i + 1, i); idx.push(n, n + i, n + i + 1); }
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        idx.push(i, j, n + j, i, n + j, n + i);
      }
      const vd = new B.VertexData();
      vd.positions = pos;
      vd.indices = idx;
      const nrm = [];
      B.VertexData.ComputeNormals(pos, idx, nrm);
      vd.normals = nrm;
      const m = new B.Mesh('prism', scene);
      vd.applyToMesh(m, true);
      m.convertToFlatShadedMesh();
      worldUV(m);
      return keep(m, material);
    }
    function place(mesh, parent, x, y, z, rx = 0, ry = 0, rz = 0) {
      mesh.parent = parent;
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      return mesh;
    }
    // Двускатная кровля из двух скатов-досок, конёк сверху.
    function gableRoof(node, w, d, rh, y, over = 0.7) {
      const half = w / 2 + over;
      const a = Math.atan2(rh, w / 2);
      const L = half / Math.cos(a) + 0.15;
      for (const s of [-1, 1]) {
        const slab = box(L, 0.24, d + over * 2, roofMat, 1 / 3);
        place(slab, node, s * half / 2, y + rh - half / 2 * Math.tan(a) + 0.12, 0, 0, 0, -s * a);
      }
      place(box(0.34, 0.34, d + over * 2 + 0.2, darkWood, 0), node, 0, y + rh + 0.12, 0);
    }

    function izba(x, z, rot, w, d, floors, litChance = 0.6) {
      const node = new B.TransformNode('izba', scene);
      node.position.set(x, PLAT_Y, z);
      node.rotation.y = rot;
      const h = floors * 3.0 + 0.4;
      place(box(w, h, d, logMat), node, 0, h / 2, 0);
      // Выпуски брёвен на углах («в обло»).
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        place(box(0.38, h, 0.38, logMat), node, sx * (w / 2 + 0.12), h / 2, sz * (d / 2 + 0.12));
      }
      const rh = w * 0.48;
      place(prism([[-w / 2, 0], [w / 2, 0], [0, rh - 0.2]], d - 0.04, logMat), node, 0, h, 0);
      gableRoof(node, w, d, rh, h);
      // Причелины и полотенце на фронтоне.
      place(box(0.25, 1.1, 0.12, darkWood, 0), node, 0, h + rh - 0.6, d / 2 + 0.75);
      const attic = B.MeshBuilder.CreatePlane('w', { width: 0.6, height: 0.75 }, scene);
      place(keep(attic, rnd() < 0.5 ? winLit : winDark), node, 0, h + rh * 0.38, -(d / 2 + 0.03), 0, 0, 0);
      // Окна с наличниками по стенам, часть горит.
      const faces = [[w / 2, 0, -Math.PI / 2, d], [-w / 2, 0, Math.PI / 2, d], [0, d / 2, Math.PI, w], [0, -d / 2, 0, w]];
      for (let f = 0; f < floors; f++) {
        const y = 1.6 + f * 3.0;
        for (const [fx, fz, ry, len] of faces) {
          const n = Math.max(1, Math.floor(len / 2.6));
          for (let i = 0; i < n; i++) {
            if (rnd() < 0.25) continue;
            const off = (i - (n - 1) / 2) * (len / n);
            const lit = rnd() < litChance;
            const px = fx !== 0 ? fx * 1.0 + Math.sign(fx) * 0.03 : off;
            const pz = fz !== 0 ? fz + Math.sign(fz) * 0.03 : off;
            const win = B.MeshBuilder.CreatePlane('w', { width: 0.75, height: 0.95 }, scene);
            place(keep(win, lit ? winLit : winDark), node, px, y, pz, 0, ry, 0);
            const frame = box(0.95, 1.2, 0.06, darkWood, 0);
            place(frame, node, px - (fx !== 0 ? Math.sign(fx) * 0.04 : 0), y, pz - (fz !== 0 ? Math.sign(fz) * 0.04 : 0), 0, ry, 0);
            const sill = box(1.1, 0.1, 0.16, darkWood, 0);
            place(sill, node, px, y - 0.62, pz, 0, ry, 0);
            if (lit) {
              node.computeWorldMatrix(true);
              const out = V3(px * 1.15, y, pz * 1.15);
              lightSource(B.Vector3.TransformCoordinates(out, node.getWorldMatrix()), 'window');
            }
          }
        }
      }
      // Крыльцо с дверью на фасаде (минус z — к каналу).
      const door = box(1.1, 2.0, 0.08, mat('door', { diffuseTexture: logMat.diffuseTexture, diffuseColor: new B.Color3(0.7, 0.55, 0.45) }), 1 / 2);
      place(door, node, w * 0.25, 1.0, -(d / 2 + 0.05));
      if (floors > 1) {
        place(box(w + 0.6, 0.18, 1.3, boardMat, 1 / 4), node, 0, 3.2, -(d / 2 + 0.65));
        place(box(w + 0.6, 0.12, 0.12, darkWood, 0), node, 0, 4.15, -(d / 2 + 1.25));
        const n = Math.round(w / 0.9);
        for (let i = 0; i <= n; i++) place(box(0.08, 0.9, 0.08, darkWood, 0), node, -w / 2 - 0.3 + i * (w + 0.6) / n, 3.7, -(d / 2 + 1.25));
      }
      return node;
    }

    function tower(x, z, r, h, litChance = 0.7) {
      const node = new B.TransformNode('tower', scene);
      node.position.set(x, PLAT_Y, z);
      const cyl = (top, bot, height, material, uv = 1 / 2.8, tess = 8) => {
        const m = B.MeshBuilder.CreateCylinder('c', { diameterTop: top * 2, diameterBottom: bot * 2, height, tessellation: tess }, scene);
        if (uv) worldUV(m, uv);
        return keep(m, material);
      };
      place(cyl(r, r * 1.06, h, logMat), node, 0, h / 2, 0);
      place(cyl(r + 0.9, r + 0.9, 0.25, boardMat, 1 / 4), node, 0, h, 0);
      for (let i = 0; i < 16; i++) {
        const a = i / 16 * Math.PI * 2;
        place(box(0.1, 1.0, 0.1, darkWood, 0), node, Math.cos(a) * (r + 0.8), h + 0.6, Math.sin(a) * (r + 0.8));
      }
      const ring = keep(B.MeshBuilder.CreateTorus('t', { diameter: (r + 0.8) * 2, thickness: 0.1, tessellation: 16 }, scene), darkWood);
      place(ring, node, 0, h + 1.1, 0);
      place(cyl(r * 0.78, r * 0.78, 2.4, logMat), node, 0, h + 1.2, 0);
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2 + Math.PI / 8;
        const upper = i % 2 === 0;
        const rr = (upper ? r * 0.78 : r) * Math.cos(Math.PI / 8) + 0.04;
        const lit = rnd() < litChance;
        const win = B.MeshBuilder.CreatePlane('w', { width: 0.6, height: 0.9 }, scene);
        const y = upper ? h + 1.3 : h * 0.55;
        place(keep(win, lit ? winLit : winDark), node, Math.cos(a) * rr, y, Math.sin(a) * rr, 0, Math.atan2(-Math.cos(a), -Math.sin(a)), 0);
        if (lit) lightSource(V3(x + Math.cos(a) * rr * 1.3, PLAT_Y + y, z + Math.sin(a) * rr * 1.3), 'window');
      }
      const coneH = r * 2.6;
      place(cyl(0, r + 1.1, coneH, roofMat, 1 / 3), node, 0, h + 2.4 + coneH / 2, 0);
      place(cyl(0.32, 0.36, 1.1, darkWood, 0), node, 0, h + 2.4 + coneH + 0.3, 0);
      const s = 0.75;
      const shape = [[0, 0], [0.5, 0.05], [0.72, 0.35], [0.68, 0.7], [0.45, 1.0], [0.16, 1.3], [0.02, 1.62]].map(([a, b]) => V3(a * s, b * s, 0));
      const dome = keep(B.MeshBuilder.CreateLathe('dome', { shape, tessellation: 14 }, scene), roofMat);
      place(dome, node, 0, h + 2.4 + coneH + 0.8, 0);
      place(cyl(0.02, 0.05, 1.2, darkWood, 0, 5), node, 0, h + 2.4 + coneH + 2.6, 0);
      return V3(x, PLAT_Y + h + 1.5, z);
    }

    // Фонарь на столбе.
    function lantern(x, y, z, h = 2.4) {
      keep(B.MeshBuilder.CreateCylinder('post', { diameterTop: 0.14, diameterBottom: 0.18, height: h, tessellation: 6 }, scene), darkWood).position.set(x, y + h / 2, z);
      box(0.6, 0.06, 0.06, darkWood, 0).position.set(x + 0.25, y + h - 0.05, z);
      const p = V3(x + 0.5, y + h - 0.32, z);
      box(0.24, 0.34, 0.24, lampMat, 0).position.copyFrom(p);
      lightSource(p, 'lamp');
    }

    // Костёр: поленья, пламя, дым и искры из системы частиц.
    const fires = [];
    function particles(name, at, o) {
      const ps = new B.ParticleSystem(name, o.capacity, scene);
      ps.particleTexture = flare;
      ps.emitter = at;
      ps.minEmitBox = V3(-o.spread, 0, -o.spread);
      ps.maxEmitBox = V3(o.spread, 0, o.spread);
      ps.color1 = o.c1;
      ps.color2 = o.c2;
      ps.colorDead = o.dead;
      ps.minSize = o.size[0];
      ps.maxSize = o.size[1];
      ps.minLifeTime = o.life[0];
      ps.maxLifeTime = o.life[1];
      ps.emitRate = o.rate;
      ps.blendMode = o.add ? B.ParticleSystem.BLENDMODE_ADD : B.ParticleSystem.BLENDMODE_STANDARD;
      ps.gravity = V3(0, o.lift, 0);
      ps.direction1 = V3(-o.dir, 1, -o.dir);
      ps.direction2 = V3(o.dir, 1.4, o.dir);
      ps.minEmitPower = o.power[0];
      ps.maxEmitPower = o.power[1];
      ps.minAngularSpeed = -1;
      ps.maxAngularSpeed = 1;
      ps.updateSpeed = 0.016;
      ps.start();
      return ps;
    }
    function bonfire(x, z) {
      const y = PLAT_Y + 0.2;
      keep(B.MeshBuilder.CreateCylinder('pad', { diameterTop: 1.8, diameterBottom: 2.0, height: 0.2, tessellation: 10 }, scene), mat('stone', { diffuseColor: new B.Color3(0.16, 0.15, 0.14) })).position.set(x, PLAT_Y + 0.1, z);
      for (let i = 0; i < 5; i++) {
        const log = keep(B.MeshBuilder.CreateCylinder('log', { diameterTop: 0.16, diameterBottom: 0.2, height: 1.1, tessellation: 6 }, scene), darkWood);
        log.position.set(x, y + 0.25, z);
        log.rotation.set(0.9, i / 5 * Math.PI * 2, 0);
      }
      const at = V3(x, y + 0.25, z);
      particles('flame', at, { capacity: 160, spread: 0.25, c1: new B.Color4(1, 0.75, 0.35, 1), c2: new B.Color4(1, 0.4, 0.1, 1), dead: new B.Color4(0.3, 0.05, 0, 0), size: [0.35, 0.8], life: [0.25, 0.6], rate: 110, add: true, lift: 2.5, dir: 0.18, power: [0.6, 1.2] });
      particles('smoke', V3(x, y + 1.2, z), { capacity: 60, spread: 0.2, c1: new B.Color4(0.18, 0.17, 0.17, 0.35), c2: new B.Color4(0.12, 0.12, 0.13, 0.25), dead: new B.Color4(0.1, 0.1, 0.12, 0), size: [0.8, 1.8], life: [2.5, 4.5], rate: 12, add: false, lift: 0.4, dir: 0.25, power: [0.3, 0.6] });
      particles('sparks', at, { capacity: 40, spread: 0.3, c1: new B.Color4(1, 0.7, 0.3, 1), c2: new B.Color4(1, 0.5, 0.15, 1), dead: new B.Color4(1, 0.3, 0, 0), size: [0.04, 0.09], life: [0.8, 1.8], rate: 14, add: true, lift: 1.5, dir: 0.4, power: [1, 2.2] });
      lightSource(V3(x, y + 1.2, z), 'fire');
      fires.push(new THREE.Vector3(x, y, z));
    }

    // Горожане: вырезаны с картинки города, стоят плоскими фигурами, поворачиваясь к камере.
    const people = [];
    const atlasTex = new B.Texture(PEOPLE_IMG, scene, false, true);
    atlasTex.hasAlpha = true;
    const PEOPLE_ATLAS = {"size": [632, 384], "rects": [[0, 36, 114, 348], [122, 12, 120, 372], [250, 18, 138, 366], [396, 0, 228, 384]]};
    const personMats = [mat('person', { diffuseTexture: atlasTex, backFaceCulling: false, emissiveColor: new B.Color3(0.18, 0.15, 0.13) })];
    function person(x, z, y = PLAT_Y) {
      const [W, H] = PEOPLE_ATLAS.size;
      const [ax, ay, aw, ah] = pick(PEOPLE_ATLAS.rects);
      const h = 1.62 + rnd() * 0.22;
      const flip = rnd() < 0.5;
      const u0 = ax / W, u1 = (ax + aw) / W, v0 = 1 - (ay + ah) / H, v1 = 1 - ay / H;
      const p = B.MeshBuilder.CreatePlane('person', { width: h * aw / ah, height: h, frontUVs: flip ? new B.Vector4(u1, v0, u0, v1) : new B.Vector4(u0, v0, u1, v1), backUVs: flip ? new B.Vector4(u0, v0, u1, v1) : new B.Vector4(u1, v0, u0, v1), sideOrientation: B.Mesh.DOUBLESIDE }, scene);
      p.material = personMats[0];
      p.billboardMode = B.Mesh.BILLBOARDMODE_Y;
      p.position.set(x, y + h / 2, z);
      people.push({ m: p, h, phase: rnd() * 10 });
      return p;
    }

    // Помосты на сваях.
    const colliders = [];
    const pileSpots = [];
    function platform(cx, cz, sx, sz) {
      box(sx, 0.35, sz, boardMat, 1 / 4).position.set(cx, PLAT_Y - 0.17, cz);
      box(sx + 0.1, 0.3, sz + 0.1, darkWood, 0).position.set(cx, PLAT_Y - 0.45, cz);
      for (let x = -sx / 2; x <= sx / 2 + 0.01; x += 2.4) { pileSpots.push([cx + x, cz - sz / 2], [cx + x, cz + sz / 2]); }
      for (let z = -sz / 2 + 2.4; z < sz / 2 - 0.01; z += 2.4) { pileSpots.push([cx - sx / 2, cz + z], [cx + sx / 2, cz + z]); }
      colliders.push({ x0: cx - sx / 2, x1: cx + sx / 2, z0: cz - sz / 2, z1: cz + sz / 2 });
    }

    /* ---------- лодки ---------- */

    const hullMat = mat('hull', { diffuseTexture: boardMat.diffuseTexture, bumpTexture: boardMat.bumpTexture, diffuseColor: new B.Color3(0.85, 0.7, 0.58), backFaceCulling: false });
    const robeMats = [[0.23, 0.16, 0.13], [0.17, 0.16, 0.2], [0.29, 0.2, 0.15], [0.19, 0.21, 0.18]].map((c, i) => mat('robe' + i, { diffuseColor: new B.Color3(...c) }));
    const skin = mat('skin', { diffuseColor: new B.Color3(0.69, 0.53, 0.44) });
    const hatMat = mat('hat', { diffuseColor: new B.Color3(0.1, 0.09, 0.07) });

    function hullMesh(L = 4.2, W = 1.3, Hh = 0.62) {
      const N = 18, M = 10, pos = [], idx = [], uv = [];
      for (let i = 0; i <= N; i++) {
        const t = i / N, z = (t - 0.5) * L;
        const taper = Math.pow(Math.sin(Math.PI * t), 0.65);
        const half = W / 2 * taper, depth = Hh * (0.45 + 0.55 * taper);
        const sheer = 0.12 + 0.42 * Math.pow(Math.abs(t - 0.5) * 2, 2.2);
        for (let j = 0; j <= M; j++) {
          const a = j / M * Math.PI;
          pos.push(-Math.cos(a) * half, sheer - Math.sin(a) * depth, z);
          uv.push(j / M * 1.2, t * 2.5);
        }
      }
      for (let i = 0; i < N; i++) for (let j = 0; j < M; j++) {
        const a = i * (M + 1) + j, b = a + 1, c = a + M + 1, d = c + 1;
        idx.push(a, b, c, b, d, c);
      }
      const vd = new B.VertexData();
      vd.positions = pos; vd.indices = idx; vd.uvs = uv;
      const nrm = [];
      B.VertexData.ComputeNormals(pos, idx, nrm);
      vd.normals = nrm;
      const m = new B.Mesh('hull', scene);
      vd.applyToMesh(m);
      m.material = hullMat;
      return m;
    }

    const moving = [];   // всё, что отражается и не сливается: лодки, люди
    // Лодка с гребцом. Нос — по +z. Вёсла: в гребке лопасть в воде и идёт к корме, на заносе — по воздуху.
    function makeBoat(withRower, light) {
      const root = new B.TransformNode('boat', scene);
      const parts = [];
      const add = (m, parent = root) => { m.parent = parent; parts.push(m); return m; };
      add(hullMesh());

        for (const side of [-1, 1]) {
          const arm = B.MeshBuilder.CreateCylinder('arm', { diameter: 0.1, height: 0.62, tessellation: 6 }, scene);
          arm.material = robe;

    }
    function poseOars(b, phase, amount) {
      const s = Math.sin(phase), c = Math.cos(phase);
      const k = Math.min(1, Math.max(0, (s + 0.2) / 0.4));
      const tilt = (0.08 + (-0.22 - 0.08) * k * k * (3 - 2 * k)) * amount - 0.12 * (1 - amount);
      for (const o of b.oars) o.pivot.rotation.set(0, -o.side * c * 0.55 * amount, o.side * tilt);
      if (b.rower) b.rower.rotation.x = c * 0.2 * amount;
    }

    /* ---------- планировка ---------- */

    const BLOCK = 22;
    const xs = [-54, -18, 18, 54], zs = [0, -36, -72, -108];

    const bells = [];
    for (const cx of xs) for (const cz of zs) {
      if ((cx === -54 && cz === -36) || (cx === 54 && cz === -72)) continue;
      platform(cx, cz, BLOCK, BLOCK);
      const s = cx > 0 ? -1 : 1;
      const front = s > 0 ? -Math.PI / 2 : Math.PI / 2;   // фасад (минус z дома) к главному каналу
      if (towersAt.has(`${cx},${cz}`)) {
        bells.push(tower(cx + s * 5.5, cz - 5, 2.4 + rnd() * 0.5, 9 + rnd() * 4));
        izba(cx + s * 5, cz + 5.5, front, 6.5, 7.5, rnd() < 0.5 ? 2 : 1);

      }
      for (const [dx, dz] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) {

    function bridge(z) {
      const deckY = 3.0;
      box(16, 0.35, 3.2, boardMat, 1 / 4).position.set(0, deckY, z);
      for (const sx of [-1, 1]) {
        for (const dz of [-1.3, 1.3]) keep(B.MeshBuilder.CreateCylinder('pillar', { diameterTop: 0.44, diameterBottom: 0.52, height: deckY + 2, tessellation: 8 }, scene), darkWood).position.set(sx * 7.6, (deckY - 2) / 2, z + dz);
        const st = box(2.2, 0.3, 3.2, boardMat, 1 / 4);

      }
      for (const dz of [-1.5, 1.5]) {

        for (let x = -7; x <= 7; x += 1.75) box(0.16, 1.5, 0.16, darkWood, 0).position.set(x, deckY + 1.95, z + dz);
      }
      const node = new B.TransformNode('bridgeRoof', scene);
      node.position.set(0, 0, z);
      node.rotation.y = Math.PI / 2;
      gableRoof(node, 3.2, 15, 1.4, deckY + 2.7, 0.5);
      for (const sx of [-4, 4]) {
        const p = V3(sx, deckY - 0.4, z);
        box(0.2, 0.3, 0.2, lampMat, 0).position.copyFrom(p);
        lightSource(p, 'lamp');
      }
      for (let i = 0; i < 2; i++) person(-5 + rnd() * 10, z + (rnd() - 0.5) * 1.6, deckY + 0.18);
    }
    bridge(-30);
    bridge(-80);

    // Терем в конце главного канала.
    (() => {
      const cz = -150;
      platform(0, cz, 44, 26);
      izba(0, cz - 1, Math.PI, 13, 10, 3, 0.85);
      bells.push(tower(-12, cz - 2, 2.8, 14, 0.8), tower(12, cz - 2, 2.8, 14, 0.8));
      izba(-17, cz + 6, -Math.PI / 2, 6, 7, 1);
      izba(17, cz + 6, Math.PI / 2, 6, 7, 1);
      bonfire(-6, cz + 10);
      bonfire(6, cz + 10);
      for (let i = 0; i < 9; i++) person(-10 + rnd() * 20, cz + 8 + rnd() * 3.8);
      for (const x of [-20, -8, 8, 20]) lantern(x, PLAT_Y, cz + 12.4, 2.8);
    })();

    // Ворота, через которые вы вошли.
    (() => {
      const z = 46;
      platform(-14, z, 14, 8);
      platform(14, z, 14, 8);
      bells.push(tower(-9.5, z, 2.6, 10), tower(9.5, z, 2.6, 10));
      box(16, 1.6, 3, logMat).position.set(0, PLAT_Y + 7.5, z);
      const node = new B.TransformNode('gateRoof', scene);
      node.position.set(0, 0, z);
      node.rotation.y = Math.PI / 2;
      gableRoof(node, 3, 16, 1.6, PLAT_Y + 8.3, 0.5);
      const signT = new B.DynamicTexture('sign', { width: 512, height: 100 }, scene, true);
      const sg = signT.getContext();
      sg.fillStyle = '#20150e'; sg.fillRect(0, 0, 512, 100);
      sg.fillStyle = '#e9c27a'; sg.font = 'bold 64px Georgia, serif'; sg.textAlign = 'center'; sg.textBaseline = 'middle';
      sg.fillText('КИТЕЖЪ', 256, 54);
      signT.update();
      const sign = B.MeshBuilder.CreatePlane('sign', { width: 4.5, height: 0.9 }, scene);
      sign.material = mat('signM', { emissiveTexture: signT, disableLighting: true, emissiveColor: new B.Color3(0.75, 0.7, 0.6) });
      sign.position.set(0, PLAT_Y + 7.4, z - 1.52);
      moving.push(sign);
      for (const sx of [-1, 1]) {
        const leaf = box(3.4, 6, 0.25, mat('gateDoor', { diffuseTexture: boardMat.diffuseTexture, diffuseColor: new B.Color3(0.6, 0.48, 0.38) }), 1 / 2);
        leaf.position.set(sx * 6.4, PLAT_Y + 3, z - 3.1);
        leaf.rotation.y = -sx * 1.2;
      }
      lantern(-6.5, PLAT_Y, z - 3.6, 2.6);
      lantern(5.8, PLAT_Y, z - 3.6, 2.6);
    })();

    // Сливаем статику по материалам.
    const statics = [];
    for (const [m, list] of byMat) {
      const merged = B.Mesh.MergeMeshes(list, true, true, undefined, false, false);
      if (merged) { merged.material = m; merged.freezeWorldMatrix(); statics.push(merged); }
    }

    // Сваи — тонкими экземплярами одной сваи.
    const pile = B.MeshBuilder.CreateCylinder('pile', { diameterTop: 0.32, diameterBottom: 0.36, height: 2.6, tessellation: 6 }, scene);
    pile.material = darkWood;
    const pm = new Float32Array(pileSpots.length * 16);
    pileSpots.forEach(([x, z], i) => B.Matrix.Translation(x, PLAT_Y - 1.5, z).copyToArray(pm, i * 16));
    pile.thinInstanceSetBuffer('matrix', pm, 16);
    statics.push(pile);

    // Лес: ярусные ели вокруг озера, тёмные холмы на дальнем берегу.
    (() => {
      const shore = B.MeshBuilder.CreateDisc('shore', { radius: 420, tessellation: 48 }, scene);
      shore.rotation.x = Math.PI / 2;
      shore.position.set(LAKE.x, 0.22, LAKE.z);
      shore.material = mat('ground', { diffuseColor: new B.Color3(0.05, 0.07, 0.06) });
      const tiers = [[1, 0.5, 0], [0.78, 0.42, 0.3], [0.55, 0.38, 0.55]].map(([r, h, y]) => {
        const c = B.MeshBuilder.CreateCylinder('tier', { diameterTop: 0, diameterBottom: r * 2, height: h, tessellation: 7 }, scene);
        c.position.y = y + h / 2;
